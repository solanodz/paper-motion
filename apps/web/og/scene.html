<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>paper-motion · OG</title>
<!--
  The site's link preview (1200×630), rendered by the engine: `pamo still og/scene.html --t 1.6 --out public/site/og.png`
  and, with ?board, the preview for board links (`--out public/site/og-board.png`). A still of the brand's own material:
  a quiet dither field, the wordmark, one line.
-->
<style>
  @font-face { font-family: GSerif; src: url(../src/fonts/GeistSerif-Regular.woff2); }
  @font-face { font-family: GMono; font-weight: 100 900; src: url(../../../registry/_demo/fonts/GeistMono-Variable.woff2); }
  #stage { overflow: hidden; background: #000; }
  .abs { position: absolute; }
  #bg { inset: 0; opacity: .9; }
  #grid { inset: 0; background-image: linear-gradient(to right, #161616 1px, transparent 1px), linear-gradient(to bottom, #161616 1px, transparent 1px); background-size: 100px 100px; mix-blend-mode: screen; }
  #mark { left: 72px; top: 72px; font: 400 44px/1 GSerif; color: #fff; letter-spacing: -0.02em; }
  #title { left: 72px; bottom: 150px; font: 400 104px/0.95 GSerif; color: #fff; letter-spacing: -0.03em; width: 900px; }
  #line { left: 72px; bottom: 80px; font: 500 24px/1 GMono; color: #8a8a8a; }
  #tag { right: 72px; top: 72px; font: 500 20px/1 GMono; color: #E9E4D8; padding: 10px 14px; border: 1.5px solid #E9E4D8; }
  #opts { right: 72px; top: 150px; display: flex; gap: 10px; }
  #opts span { width: 110px; height: 66px; border: 1.5px solid #3a3a3a; font: 500 16px/1 GMono; color: #fff; padding: 9px; box-sizing: border-box; background: rgba(0,0,0,.5); }
  #opts span:nth-child(3) { border-color: #E9E4D8; color: #E9E4D8; }
</style>
</head>
<body>
<main id="stage">
  <div id="bg" class="abs"></div>
  <div id="grid" class="abs"></div>
  <div id="mark" class="abs">paper-motion</div>
  <div id="tag" class="abs"></div>
  <div id="title" class="abs"></div>
  <div id="line" class="abs"></div>
  <div id="opts" class="abs"></div>
</main>
<script type="module">
import { scene } from 'paper-motion';
const board = new URLSearchParams(location.search).has('board');
const s = scene({ width: 1200, height: 630, fps: 30, duration: 3, background: '#000' });
s.shader('#bg', 'Dithering', { speed: 0.6, shape: 'simplex', type: '4x4', size: 2, scale: 0.7, colorBack: '#00000000', colorFront: '#2c2c2c' });
document.querySelector('#title').textContent = board ? 'Your agent proposes. You choose.' : 'Motion your agent can use.';
document.querySelector('#line').textContent = board ? 'Open the board: options play live, in your look' : 'backgrounds · transitions · text · palettes · fonts · recipes';
document.querySelector('#tag').textContent = board ? 'a board' : '123 resources · free';
if (board) document.querySelector('#opts').innerHTML = ['A', 'B', 'C', 'D'].map((l) => `<span>${l}</span>`).join('');
await s.start();
</script>
</body>
</html>
