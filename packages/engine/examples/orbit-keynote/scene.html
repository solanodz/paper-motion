<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orbit · keynote</title>
<!-- Orbit product keynote, 39 s, 60 fps. ONE chain, each element becomes the next, the camera follows what leads.
     thread piles → squashes into one line → "Eleven emails." rises from it → the line becomes the text field → "Orbit"
     rises and shrinks into the window title → the window unfolds (the dithered warp leaks out behind) → the prompt types
     → chips spawn from the words → a line from the last chip draws the button → its fill spills into a band → the band
     lifts and the chips become column headers; six calendars draw up from it in depth → the band becomes a scan line
     that finds the free row → the row lights and merges into the booked card → one person drops: the card lifts, the
     scan resumes, the card lands lower, pings reach the rest → the window folds back into the field, into the line →
     "No back and forth." rises from it; the first bubble returns and is squashed → the line curls into a ring filled
     with the smooth warp → "Orbit. Meetings find their own time." → a pill. Beats are keyed to Eric's words
     (audio/words.json). Render from this folder: pamo render scene.html --fps 60 --motion-blur 4 [--audio voice.wav]. -->
<style>
  #stage { overflow: hidden; color: #FFF; font-family: 'Space Grotesk', sans-serif; perspective: 1500px; perspective-origin: 50% 50%; }
  .abs { position: absolute; box-sizing: border-box; }
  .sh { position: absolute; inset: 0; }
  #cam { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-style: preserve-3d; }
  .layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-style: preserve-3d; }
  .m { font-family: 'Space Mono', monospace; letter-spacing: 0.04em; white-space: nowrap; }
  .d { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.05em; white-space: nowrap; }
  .ch { display: inline-block; }
  .bub { position: absolute; padding: 14px 22px; border: 1px solid #FFF; font-size: 26px; line-height: 1.2; white-space: nowrap; background: #000; transform-origin: 50% 100%; opacity: 0; }
  .bub.them { border-color: #8A8A8A; color: #8A8A8A; }
  .dots { position: absolute; padding: 14px 18px; border: 1px solid #8A8A8A; background: #000; display: flex; gap: 7px; opacity: 0; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #8A8A8A; display: block; }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px 10px 11px; border-radius: 999px; border: 1px solid #FFF; font-size: 24px; font-weight: 500; white-space: nowrap; background: #000; opacity: 0; transform-origin: 0 50%; }
  .chip .ok { font-family: 'Space Mono', monospace; font-size: 14px; color: #FFF; opacity: 0; margin-left: -6px; }
  .av { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #FFF; display: inline-flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 13px; }
  .mask { position: absolute; overflow: hidden; }
  .col { position: absolute; transform-style: preserve-3d; }
  .ev { position: absolute; border: 1px solid #2A2A2A; background: #0A0A0A; opacity: 0; }
  .ping { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #FFF; margin: -5px 0 0 -5px; opacity: 0; }
</style>
</head>
<body>
<main id="stage">
  <div id="cam">
    <div id="far" class="layer">
      <div id="planeBox" class="abs" style="left:-100px;top:-120px;width:2120px;height:1340px;overflow:hidden;clip-path:inset(50% 50% 50% 50%)"><div id="plane" class="sh"></div></div>
    </div>
    <div id="mid" class="layer">
      <div id="thread" class="abs" style="left:0;top:0"></div>
      <div id="line" class="abs" style="left:960px;top:840px;width:0;height:2px;border:1px solid #FFF;background:#000"></div>
      <div id="mask1" class="mask" style="left:400px;top:0;width:1200px;height:140px"><div id="eleven" class="d" style="position:absolute;left:0;top:20px;font-size:100px;line-height:1"></div></div>
      <div id="mask2" class="mask" style="left:400px;top:0;width:1260px;height:230px"><div id="orbit" class="d" style="position:absolute;left:60px;top:20px;font-size:150px;line-height:1;transform-origin:0 0">Orbit</div><div id="sub" style="position:absolute;left:4px;top:176px;font-size:40px;font-weight:500;letter-spacing:-0.03em;white-space:nowrap">schedules meetings for you.</div></div>
      <svg class="abs" style="left:0;top:0;overflow:visible" width="2000" height="1200">
        <line id="wtop" x1="360" y1="300" x2="1560" y2="300" stroke="#FFF" stroke-width="2"/>
        <line id="whead" x1="360" y1="356" x2="1560" y2="356" stroke="#FFF" stroke-width="1.5"/>
        <line id="wl" x1="360" y1="300" x2="360" y2="1000" stroke="#FFF" stroke-width="2"/>
        <line id="wr" x1="1560" y1="300" x2="1560" y2="1000" stroke="#FFF" stroke-width="2"/>
        <line id="wbot" x1="360" y1="1000" x2="1560" y2="1000" stroke="#FFF" stroke-width="2"/>
        <path id="conn" d="M 1388 556 V 910 H 660" fill="none" stroke="#FFF" stroke-width="1.5"/>
        <rect id="btn" x="400" y="880" width="260" height="60" fill="none" stroke="#FFF" stroke-width="1.5"/>
      </svg>
      <div id="wfill" class="abs" style="left:361px;top:301px;width:1198px;height:698px;background:#000;opacity:0"></div>
      <div id="wtitle" class="abs m" style="left:384px;top:318px;font-size:18px;opacity:0">ORBIT <span style="color:#8A8A8A">· THIS WEEK</span></div>
      <div id="wcount" class="abs m" style="left:1300px;top:318px;width:236px;text-align:right;font-size:18px;color:#8A8A8A;opacity:0">0 PEOPLE</div>
      <div id="prompt" class="abs" style="left:420px;top:410px;font-size:30px;white-space:pre;opacity:0"></div>
      <div id="cur" class="abs" style="left:420px;top:412px;width:14px;height:34px;background:#FFF;opacity:0"></div>
      <div id="ul" class="abs" style="left:0;top:448px;height:2px;background:#FFF;width:0"></div>
      <div id="btnt" class="abs m" style="left:402px;top:882px;width:256px;height:56px;display:flex;align-items:center;justify-content:center;font-size:17px;opacity:0"></div>
      <div class="abs" style="left:402px;top:882px;width:256px;height:56px;overflow:hidden"><div id="bfill" class="abs" style="left:0;top:0;width:256px;height:56px;clip-path:inset(0 100% 0 0)"><div id="bfill-sh" class="sh"></div></div></div>
      <!-- the band: the spill, then the scan line -->
      <div id="band" class="abs" style="left:402px;top:940px;width:256px;height:0;overflow:hidden"><div id="band-sh" class="sh"></div></div>
      <!-- the calendars -->
      <div id="times" class="abs" style="left:0;top:0"></div>
      <div id="cols" class="abs" style="left:0;top:0"></div>
      <div id="slots" class="abs" style="left:0;top:0"></div>
      <div id="card" class="abs" style="left:400px;top:660px;width:1120px;height:44px;border:1px solid #FFF;overflow:hidden;opacity:0;background:#000"><div id="card-sh" class="sh"></div><div id="cardt" class="abs m" style="left:14px;top:12px;font-size:15px;background:#000;padding:1px 6px"></div><div id="booked" class="abs m" style="right:14px;top:12px;font-size:15px;background:#000;padding:1px 6px;opacity:0">BOOKED</div></div>
      <div id="pings" class="abs" style="left:0;top:0"></div>
      <div id="chips" class="abs" style="left:0;top:0"></div>
      <!-- the return of the problem, and the end -->
      <div id="mask3" class="mask" style="left:560px;top:0;width:900px;height:140px"><div id="noback" class="d" style="position:absolute;left:0;top:20px;font-size:100px;line-height:1"></div></div>
      <div id="mask4" class="mask" style="left:560px;top:0;width:800px;height:120px"><div id="bub2" class="bub them" style="left:0;top:40px;opacity:1;transform-origin:50% 100%">Does Tuesday work for everyone?</div></div>
      <svg class="abs" style="left:0;top:0;overflow:visible" width="2000" height="1200"><circle id="ring" cx="960" cy="650" r="170" fill="none" stroke="#FFF" stroke-width="2" transform="rotate(-90 960 650)"/><rect id="pill" x="1184" y="790" width="210" height="54" rx="27" fill="none" stroke="#FFF" stroke-width="1.5"/></svg>
      <div class="abs" style="left:790px;top:480px;width:340px;height:340px;border-radius:50%;overflow:hidden"><div id="ringfill" class="abs" style="left:0;top:0;width:340px;height:340px;clip-path:circle(0px at 170px 170px)"><div id="ring-sh" class="sh"></div></div></div>
      <div id="orbit2" class="abs d" style="left:1180px;top:560px;font-size:150px;line-height:1"></div>
      <div id="tag" class="abs" style="left:1186px;top:722px;font-size:44px;font-weight:500;letter-spacing:-0.03em;white-space:nowrap"></div>
      <div id="pillt" class="abs m" style="left:1184px;top:790px;width:210px;height:54px;display:flex;align-items:center;justify-content:center;font-size:17px;opacity:0"></div>
      <div class="abs" style="left:1185px;top:791px;width:208px;height:52px;border-radius:26px;overflow:hidden"><div id="pillfill" class="abs" style="left:0;top:0;width:208px;height:52px;clip-path:inset(0 100% 0 0)"><div id="pill-sh" class="sh"></div></div></div>
    </div>
  </div>
  <div id="hud"><div id="count" class="abs m" style="left:96px;top:64px;font-size:18px;opacity:0"></div></div>
</main>
<script type="module">
import { scene, progress, ease, clamp, lerp } from 'paper-motion';
import { typeOn, typingTimes, keySounds } from 'paper-motion/moves';
import { loadBrand } from 'paper-motion/brand';

const B = await loadBrand('./brand');
const WORDS = await (await fetch('./audio/words.json')).json();
const clean = (w) => w.toLowerCase().replace(/[^a-z0-9']/g, '');
const W = (word, n = 1) => { let k = 0; for (const x of WORDS) if (clean(x.w) === word && ++k === n) return x.t; throw new Error(`word "${word}" #${n} not spoken`); };

const FPS = 60, DUR = 39;
const s = scene({ width: 1920, height: 1080, fps: 30, duration: DUR, background: B.color('ground') });
const $ = (id) => document.getElementById(id);
const mk = (cls, parent, css = {}) => { const d = Object.assign(document.createElement('div'), { className: cls }); Object.assign(d.style, css); parent.append(d); return d; };
const use = (sel, id, extra = {}) => { const e = B.set.entries.find((x) => x.id === id); return s.shader(sel, e.shader, { ...e.props, ...extra }); };
use('#plane', 'dither-warp', { scale: 1.2 }); use('#bfill-sh', 'dither-warp', { scale: 0.16, size: 1.6 }); use('#band-sh', 'dither-warp', { scale: 0.5, size: 2 });
use('#card-sh', 'dither-warp', { scale: 0.45, size: 2 }); use('#ring-sh', 'warp', { scale: 0.6 }); use('#pill-sh', 'dither-warp', { scale: 0.14, size: 1.6 });
const punch = (t, at, amt = 0.1, decay = 7, f = 16) => (t < at ? 0 : amt * Math.exp(-(t - at) * decay) * Math.cos((t - at) * f));
const draw = (el, L, p) => { el.style.strokeDasharray = `${L}`; el.style.strokeDashoffset = `${L * (1 - p)}`; el.style.opacity = p > 0 ? 1 : 0; };
$('far').style.transform = 'translateZ(-420px)';

// ---------- timeline, keyed to the voice ----------
const V = { eleven: W('eleven'), emails: W('emails'), orbit: W('orbit', 1), you: W('you'), tell: W('tell'), who: W('who'), reads: W('reads'), gap: W('gap'), books: W('books'),
  drops: W('drops'), out: W('out'), moves: W('moves'), tells: W('tells'), rest: W('rest'), no1: W('no', 1), forth: W('forth'), no2: W('no', 2), does: W('does'), work: W('work'), orbit2: W('orbit', 2), meetings2: W('meetings', 2), time2: W('time', 2) };
const T0 = 0.4, STEP = 0.3, BASE = 900, GAP = 84, LINE_Y = 840;
const MSG = [['them', 'Does Tuesday work for everyone?'], ['me', 'Not for me, sorry'], ['them', 'Thursday then?'], ['me', "I'm out Thursday"], ['them', 'Friday morning?'], ['me', 'Dentist at 9, after 10 is fine'], ['them', 'Friday 11?'], ['me', 'Can we make it 30 min?'], ['them', 'Sure. Friday 11, 30 min?'], ['me', "Wait, Friday's a holiday"], ['them', '…']];
const tArr = (i) => T0 + i * STEP;
const SQUASH = V.eleven - 0.3, tSq = (i) => SQUASH + i * 0.06;
const ELEVEN = V.emails - 0.1, ELEVEN_OUT = 5.95, RISE = [6.0, 6.8], ORBIT = V.orbit - 0.05, SHRINK = [7.7, 8.25], UNFOLD = [8.2, 9.05];
const TYPE_AT = 9.5, PROMPT = '30 min with the design team', times = typingTimes(PROMPT, { start: TYPE_AT, cps: 30, seed: 3 });
const ENTER = times[times.length - 1] + 0.35, CHIP_AT = ENTER + 0.25, NAMES = ['Mara', 'Jonas', 'Ayo', 'Lena', 'Teo', 'Sam'];
const CONN = CHIP_AT + 1.2, BTN = CONN + 0.45, FILL = BTN + 0.5, SPILL = FILL + 0.45;
const CAL0 = V.reads - 0.35, SCAN0 = V.gap - 0.6, SLOT = V.gap + 0.05, CARD = V.books, DROP = V.drops - 0.05, LIFT = V.moves - 0.1, LAND2 = V.moves + 0.75, TELL = V.tells;
const FOLD = 25.3, NOBACK = V.no1, BUB = V.no2 - 0.1, SQB = V.work + 0.25, RING = 32.3, ORBIT2 = V.orbit2 - 0.05, TAG = V.meetings2 - 0.05, PILL = V.time2 + 1.0;

// ---------- the thread ----------
const bubs = MSG.map(([who, text]) => { const b = mk(`bub ${who}`, $('thread')); b.textContent = text; return b; });
const dots = mk('dots', $('thread')); dots.innerHTML = '<i></i><i></i><i></i>';
await document.fonts.ready;
const widths = bubs.map((b) => { b.style.opacity = 1; const w = b.offsetWidth; b.style.opacity = 0; return w; });
const xOf = (i) => (MSG[i][0] === 'them' ? 600 : 1320 - widths[i]);
const yOf = (j, t) => { let y = BASE - 60; for (let k = j + 1; k < MSG.length; k++) y -= GAP * ease.outCubic(progress(t, tArr(k) - 0.05, tArr(k) + 0.3)); return y; };

// ---------- kinetic helpers ----------
const chars = (el, text) => { el.innerHTML = [...text].map((c) => `<span class="ch">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); return [...el.children]; };
const elevenCs = chars($('eleven'), 'Eleven emails.'), orbitCs = chars($('orbit'), 'Orbit'), subCs = chars($('sub'), 'schedules meetings for you.');
const nobackCs = chars($('noback'), 'No back and forth.'), orbit2Cs = chars($('orbit2'), 'Orbit.'), tagCs = chars($('tag'), 'Meetings find their own time.');
function riseFrom(cs, t, at, { each = 0.03, dur = 0.6, h = 120 } = {}) { cs.forEach((c, i) => { const p = progress(t, at + i * each, at + i * each + dur, ease.outExpo); c.style.transform = `translateY(${(1 - p) * h}px)`; c.style.opacity = t >= at + i * each ? 1 : 0; }); }
function kin(cs, t, at, { each = 0.035, dur = 0.65, dy = 50, rot = 6 } = {}) { cs.forEach((c, i) => { const p = progress(t, at + i * each, at + i * each + dur, ease.outExpo); c.style.opacity = progress(t, at + i * each, at + i * each + dur * 0.4); c.style.transform = `translateY(${(1 - p) * dy}px) rotate(${(1 - p) * rot}deg) scale(${lerp(0.85, 1, p)})`; c.style.filter = p < 0.99 ? `blur(${(1 - p) * 12}px)` : 'none'; }); }
function leaveUp(el, t, at, dur = 0.45) { const p = progress(t, at, at + dur, ease.inExpo); el.style.opacity = 1 - p; el.style.filter = p > 0.01 ? `blur(${p * 14}px)` : 'none'; el.style.translate = `0 ${-p * 60}px`; }

// ---------- chips → column headers ----------
const chips = NAMES.map((n) => { const c = mk('chip', $('chips')); c.innerHTML = `<span class="av">${n[0]}</span>${n}<span class="ok">✓</span>`; return c; });
await new Promise((r) => requestAnimationFrame(r));
const chipW = chips.map((c) => { c.style.opacity = 1; const w = c.offsetWidth; c.style.opacity = 0; return w; });
const chipX = []; { let x = 420; chips.forEach((c, i) => { chipX.push(x); x += chipW[i] + 14; }); }
const ROW_Y = 500, SPAWN_X = 420 + 12 * 17.4, SPAWN_Y = 410;
const COLX = (i) => 405 + i * 186, COLW = 170, COLTOP = 520, ROW0 = 540, ROWH = 40, NROWS = 11, HEAD_Y = 470;
const COLZ = (i) => (i - 2.5) * 44;

// ---------- the calendars ----------
const BUSY = [[[0, 2], [5, 1], [8, 1]], [[1, 1], [4, 2], [9, 1]], [[0, 1], [2, 1], [7, 2]], [[1, 2], [5, 1], [8, 2]], [[0, 2], [4, 1], [7, 1], [9, 1]], [[2, 1], [4, 2], [8, 1]]];
const cols = NAMES.map((_, i) => {
  const c = mk('col', $('cols'), { left: `${COLX(i)}px`, top: `${COLTOP}px`, width: `${COLW}px`, height: `${NROWS * ROWH + 20}px`, transform: `translateZ(${COLZ(i)}px)` });
  c.innerHTML = `<svg class="abs" style="left:0;top:0;overflow:visible" width="${COLW}" height="${NROWS * ROWH + 20}"><path class="frame" d="M 0 ${NROWS * ROWH + 20} V 0 H ${COLW} V ${NROWS * ROWH + 20}" fill="none" stroke="#2A2A2A" stroke-width="1.5"/></svg>`;
  const evs = BUSY[i].map(([r, n]) => mk('ev', c, { left: '8px', top: `${20 + r * ROWH + 3}px`, width: `${COLW - 16}px`, height: `${n * ROWH - 6}px` }));
  const late = mk('ev', c, { left: '8px', top: `${20 + 3 * ROWH + 3}px`, width: `${COLW - 16}px`, height: `${ROWH - 6}px`, borderColor: '#8A8A8A' }); // Lena's new conflict
  const slot = mk('abs', c, { left: '8px', top: `${20 + 3 * ROWH + 3}px`, width: `${COLW - 16}px`, height: `${ROWH - 6}px`, border: '1px solid #FFF', opacity: 0 });
  return { c, frame: c.querySelector('.frame'), evs, late, slot };
});
const TIMES = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00'].map((l, i) => { const d = mk('abs m', $('times'), { left: '366px', top: `${ROW0 + i * 2 * ROWH - 8}px`, fontSize: '12px', color: '#8A8A8A', opacity: 0 }); d.textContent = l; return d; });
const pings = chips.map(() => mk('ping', $('pings')));
const rowY = (r) => ROW0 + r * ROWH;

// ---------- the line / the field: the thread's remains, the input, and back again ----------
function lineRect(t) {
  const merged = MSG.reduce((n, _, i) => n + ease.inOutCubic(progress(t, tSq(i) + 0.15, tSq(i) + 0.45)), 0);
  const w0 = (merged / MSG.length) * 800, r = progress(t, RISE[0], RISE[1], ease.inOutCubic);
  let R = { x: lerp(960 - w0 / 2, 400, r), y: lerp(LINE_Y, 396, r), w: lerp(w0, 1120, r), h: lerp(2, 64, ease.inOutCubic(progress(t, RISE[0] + 0.45, RISE[1] + 0.1))) };
  const f = progress(t, FOLD + 0.7, FOLD + 1.05, ease.inOutCubic); // the field folds back into a line at the centre
  R = { x: lerp(R.x, 560, f), y: lerp(R.y, 650, f), w: lerp(R.w, 800, f), h: lerp(R.h, 2, f) };
  const g = progress(t, RING, RING + 0.5, ease.inCubic); // and the line shrinks to a point as the ring draws
  return { x: lerp(R.x, 960, g), y: R.y, w: lerp(R.w, 0, g), h: R.h };
}

// ---------- the camera follows what leads ----------
function target(t) {
  const n = clamp(Math.floor((t - T0) / STEP) + 1, 1, MSG.length);
  let x = 960, y = yOf(Math.max(0, n - 1), t) - 150, z = 1.12, yaw = 0;
  const sq = progress(t, SQUASH, SQUASH + 0.9, ease.inOutCubic); y = lerp(y, LINE_Y - 120, sq); z = lerp(z, 1.0, sq);
  const L = lineRect(t); const r = progress(t, RISE[0], RISE[1], ease.inOutCubic); y = lerp(y, L.y + 140, r);
  const u = progress(t, UNFOLD[0], UNFOLD[1] + 0.3, ease.inOutCubic); y = lerp(y, 650, u); z = lerp(z, 0.92, u); yaw = lerp(yaw, -7, u);
  const ty = progress(t, TYPE_AT - 0.3, TYPE_AT + 0.8, ease.inOutCubic); x = lerp(x, 860, ty); y = lerp(y, 520, ty); z = lerp(z, 1.14, ty); yaw = lerp(yaw, -2, ty);
  const cx = progress(t, CHIP_AT - 0.1, CHIP_AT + 1.0, ease.inOutCubic); x = lerp(x, 960, cx); y = lerp(y, 580, cx); z = lerp(z, 1.02, cx);
  const bt = progress(t, CONN, BTN + 0.5, ease.inOutCubic); x = lerp(x, 720, bt); y = lerp(y, 800, bt); z = lerp(z, 1.3, bt); yaw = lerp(yaw, 5, bt);
  const sp = progress(t, SPILL, SPILL + 0.9, ease.inOutCubic); y = lerp(y, 920, sp); x = lerp(x, 900, sp); z = lerp(z, 1.1, sp); yaw = lerp(yaw, 0, sp);
  const ca = progress(t, CAL0, CAL0 + 1.2, ease.inOutCubic); x = lerp(x, 960, ca); y = lerp(y, 720, ca); z = lerp(z, 0.9, ca); yaw = lerp(yaw, -12, ca);   // step back: six calendars in depth
  const sc = progress(t, SCAN0 - 0.2, SLOT + 0.6, ease.inOutCubic); y = lerp(y, rowY(3) + 60, sc); z = lerp(z, 1.12, sc); yaw = lerp(yaw, -4, sc);         // lean in on the gap
  const dp = progress(t, DROP - 0.2, DROP + 0.6, ease.inOutCubic); x = lerp(x, COLX(3) + 85, dp); y = lerp(y, rowY(3) - 20, dp); z = lerp(z, 1.2, dp);        // Lena
  const mv = progress(t, LIFT, LAND2 + 0.2, ease.inOutCubic); x = lerp(x, 960, mv); y = lerp(y, rowY(6) + 40, mv); z = lerp(z, 1.05, mv);                   // follow the card down
  const tl = progress(t, TELL, TELL + 0.9, ease.inOutCubic); y = lerp(y, 640, tl); z = lerp(z, 0.92, tl); yaw = lerp(yaw, -8, tl);                           // see everyone get told
