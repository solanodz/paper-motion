<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Halo · explainer v4</title>
<!-- Halo explainer v4, in the approved motion language (the user's After Effects reference):
     real 3D depth, an inertial spring camera that banks into its moves, morphs instead of appearances, kinetic words in
     the scene, and secondary animation everywhere (rings, bursts, ticks, stars, flips, builds, counters).
     Beats are keyed to Matilda's words (audio/words.json). Render from this folder: pamo render scene.html --fps 60 --motion-blur 4 [--audio voice.wav]. -->
<style>
  #stage { overflow: hidden; color: #1F2328; font-family: 'Inter', sans-serif; perspective: 1500px; perspective-origin: 50% 50%; }
  .abs { position: absolute; box-sizing: border-box; }
  .sh { position: absolute; inset: 0; }
  #sky { position: absolute; inset: 0; background: #F7F5F0; }
  #cam { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-style: preserve-3d; }
  .layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-style: preserve-3d; }
  .k { font-family: 'Inter Tight', sans-serif; font-weight: 600; letter-spacing: -0.045em; white-space: nowrap; }
  .ch { display: inline-block; }
  .dot { position: absolute; border-radius: 50%; background: #EFA85A; }
  .ring { position: absolute; border-radius: 50%; border: 2.5px solid #EFA85A; }
  .ray { position: absolute; height: 4px; border-radius: 2px; background: #EFA85A; transform-origin: 0 50%; }
  .tick { position: absolute; font-size: 22px; font-weight: 500; color: #6B7280; white-space: nowrap; }
  .win { position: absolute; border: 2.5px solid #1F2328; border-radius: 6px; background: #FFFFFF; overflow: hidden; }
  .win::before, .win::after { content: ''; position: absolute; background: #1F2328; }
  .win::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-1px); }
  .win::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-1px); }
  .lab { position: absolute; font-size: 24px; font-weight: 500; color: #6B7280; white-space: nowrap; }
  #flash { position: absolute; inset: 0; background: #F3C98E; opacity: 0; }
  #hud { position: absolute; inset: 0; }
</style>
</head>
<body>
<main id="stage">
  <div id="sky"></div>
  <div id="cam">
    <div id="far" class="layer"></div>
    <div id="stars" class="layer"></div>
    <div id="mid" class="layer">
      <!-- A · the day chart -->
      <div id="chart" class="abs" style="left:0;top:0">
        <div id="area" class="abs" style="left:0;top:0;width:1920px;height:1080px;clip-path:path('M 160 860 C 520 860, 620 300, 860 300 C 1100 300, 1200 860, 1560 860 Z')"><div id="area-sh" class="sh"></div></div>
        <svg class="abs" style="left:0;top:0;overflow:visible" width="2600" height="1200">
          <line id="axis" x1="120" y1="860" x2="2500" y2="860" stroke="#1F2328" stroke-width="1.5"/>
          <path id="prod" d="M 160 860 C 520 860, 620 300, 860 300 C 1100 300, 1200 860, 1560 860" fill="none" stroke="#E9A04F" stroke-width="3.5" stroke-linecap="round"/>
          <path id="use" d="M 160 790 C 600 800, 900 830, 1150 800 C 1380 770, 1460 440, 1680 380" fill="none" stroke="#8E9AB5" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 11"/>
          <path id="flowpath" d="M 1040 560 C 1400 300, 1700 980, 2150 640" fill="none" stroke="none"/>
          <rect id="batline" x="2080" y="380" width="250" height="400" rx="56" fill="#FFFFFF" stroke="#1F2328" stroke-width="3"/>
        </svg>
        <div id="bat" class="abs" style="left:2092px;top:392px;width:226px;height:376px;border-radius:46px;overflow:hidden"><div id="bat-sh" class="sh"></div></div>
        <div id="bat-pct" class="lab" style="left:2150px;top:800px">0 %</div>
        <div id="ticks" class="abs" style="left:0;top:0"></div>
        <div id="flow" class="abs" style="left:0;top:0"></div>
      </div>

      <!-- B–E · the journey (lower world) -->
      <div id="row" class="abs" style="left:0;top:0">
        <svg class="abs" style="left:0;top:0;overflow:visible" width="7000" height="3600"><line id="ground" x1="200" y1="3230" x2="6600" y2="3230" stroke="#1F2328" stroke-width="1.5"/></svg>
        <div id="beam" class="abs" style="left:930px;top:2978px;width:640px;height:48px;border-radius:24px;overflow:hidden;transform-origin:0 50%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 18%,#000 100%)"><div id="beam-sh" class="sh"></div></div>
        <div id="photons" class="abs" style="left:0;top:0"></div>
        <div id="panelBox" class="abs" style="left:1480px;top:2760px;width:620px;height:430px;transform-style:preserve-3d"><svg id="panel" class="abs" style="left:0;top:0" width="620" height="430" viewBox="160 330 520 360"></svg></div>
        <div id="spark" class="abs" style="left:1600px;top:3000px"></div>
        <svg class="abs" style="left:0;top:0;overflow:visible" width="7000" height="3600"><path id="arc1" d="M 2000 3010 C 2250 2600, 2650 2600, 2930 2960" fill="none" stroke="none"/><path id="arc2" d="M 3170 3060 C 3500 2780, 3900 2800, 4200 3060" fill="none" stroke="none"/></svg>
        <div id="stream" class="abs" style="left:0;top:0"></div>
        <div id="halo2" class="abs" style="left:2900px;top:2760px;width:300px;height:470px;transform-style:preserve-3d">
          <svg class="abs" style="left:0;top:0;overflow:visible" width="300" height="470">
            <path id="handle" d="M 105 2 L 105 -46 Q 105 -64 123 -64 L 177 -64 Q 195 -64 195 -46 L 195 2" fill="none" stroke="#1F2328" stroke-width="4" stroke-linecap="round"/>
            <rect x="1.5" y="1.5" width="297" height="467" rx="60" fill="#FFFFFF" stroke="#1F2328" stroke-width="3"/></svg>
          <div id="fill2" class="abs" style="left:12px;top:12px;width:276px;height:446px;border-radius:50px;overflow:hidden"><div id="fill2-sh" class="sh"></div></div>
        </div>
        <div id="pct2" class="abs k" style="left:3240px;top:2860px;font-size:120px"></div>
        <div id="suit" class="lab" style="left:3240px;top:3010px;font-size:28px;color:#3D434B">the size of a suitcase</div>
        <div id="stream2" class="abs" style="left:0;top:0"></div>
        <div id="moon" class="abs" style="left:3420px;top:2120px;width:240px;height:240px"><div id="moon-sh" class="sh"></div></div>
        <div id="home" class="abs" style="left:4120px;top:2700px;width:520px;height:520px"></div>
        <div id="hoods" class="abs" style="left:0;top:0"></div>
      </div>

      <!-- the opening sun (A) and the journey sun (B–F): one element that the film hands over -->
      <div id="sun" class="abs" style="left:0;top:0;width:180px;height:180px">
        <div class="abs" style="left:-90%;top:-90%;width:280%;height:280%"><div id="glow" class="sh"></div></div>
        <div id="sun-sh" class="sh"></div>
      </div>
      <div id="fx" class="abs" style="left:0;top:0"></div>
    </div>
    <div id="near" class="layer"></div>
    <div id="fore" class="layer"></div>
  </div>
  <div id="flash"></div>
  <div id="hud">
    <div id="wm" class="abs k" style="left:1060px;top:330px;font-size:250px;line-height:0.85;letter-spacing:-0.05em;opacity:0">Halo</div>
    <div id="tag" class="abs k" style="left:1070px;top:600px;font-size:60px;font-weight:500;letter-spacing:-0.03em"></div>
  </div>
</main>
<script type="module">
import { scene, progress, ease, clamp, lerp } from 'paper-motion';
import { loadBrand } from 'paper-motion/brand';

const B = await loadBrand('./brand');
const WORDS = await (await fetch('./audio/words.json')).json();
const clean = (w) => w.toLowerCase().replace(/[^a-z0-9']/g, '');
const W = (word, n = 1) => { let k = 0; for (const x of WORDS) if (clean(x.w) === word && ++k === n) return x.t; throw new Error(word); };
const T = { your: W('your'), noon: W('noon'), but: W('but'), night: W('night'), halo: W('halo'), difference: W('difference'), one: W('one'), hits: W('hits'),
  two: W('two'), flows: W('flows'), suitcase: W('suitcase'), three: W('three'), down: W('down'), home: W('home'), stored: W('stored'), lower: W('lower'), bills: W('bills'),
  lights: W('lights'), blackout: W('blackout'), end: W('halo', 3), keep: W('keep'), dark: W('dark') };
const CUT = T.one - 0.15; // the dive lands; we come out of the sun

const FPS = 60, DUR = 36;
const s = scene({ width: 1920, height: 1080, fps: 30, duration: DUR, background: B.color('ground') });
const $ = (id) => document.getElementById(id);
const mk = (cls, parent, css = {}) => { const d = Object.assign(document.createElement('div'), { className: cls }); Object.assign(d.style, css); parent.append(d); return d; };
const use = (sel, id, extra = {}) => { const e = B.set.entries.find((x) => x.id === id); return s.shader(sel, e.shader, { ...e.props, ...extra }); };
use('#area-sh', 'flow', { scale: 0.7 });
use('#glow', 'sun-glow', { radius: 0.6 }); use('#sun-sh', 'sun-dither', { colorBack: 'rgba(0,0,0,0)', scale: 0.8 });
use('#bat-sh', 'charge', { scale: 0.7 });
use('#beam-sh', 'flow', { scale: 0.35, colorBack: '#FBEBD0' });
use('#fill2-sh', 'charge');
use('#moon-sh', 'night', { colorBack: 'rgba(0,0,0,0)', scale: 0.8 });
const rnd = (i, k = 1) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const punch = (t, at, amt = 0.1, decay = 6, f = 15) => (t < at ? 0 : amt * Math.exp(-(t - at) * decay) * Math.cos((t - at) * f));

// ---------- depth layers ----------
$('far').style.transform = 'translateZ(-520px)'; $('stars').style.transform = 'translateZ(-260px)'; $('near').style.transform = 'translateZ(170px)'; $('fore').style.transform = 'translateZ(560px)';
for (let i = 0; i < 26; i++) { const r = 60 + rnd(i) * 170; mk('dot', $('far'), { width: `${r}px`, height: `${r}px`, left: `${-600 + rnd(i, 2) * 7000}px`, top: `${-300 + (i % 2 ? rnd(i, 3) * 1500 : 2300 + rnd(i, 3) * 1300)}px`, opacity: 0.05 + rnd(i, 4) * 0.08, filter: 'blur(32px)', background: i % 3 ? '#F4C27F' : '#D3D9E5' }); }
for (let i = 0; i < 10; i++) { const r = 40 + rnd(i, 9) * 70; mk('dot', $('fore'), { width: `${r}px`, height: `${r}px`, left: `${200 + rnd(i, 7) * 6000}px`, top: `${(i % 2 ? 100 : 2500) + rnd(i, 8) * 900}px`, opacity: 0.16, filter: 'blur(14px)' }); }
const STARS = Array.from({ length: 40 }, (_, i) => { const r = 4 + rnd(i, 11) * 5; return mk('dot', $('stars'), { width: `${r}px`, height: `${r}px`, left: `${3300 + rnd(i, 12) * 3300}px`, top: `${1800 + rnd(i, 13) * 800}px`, background: '#9AA5BF', opacity: 0 }); });
const STARS_A = Array.from({ length: 14 }, (_, i) => { const r = 4 + rnd(i, 21) * 5; return mk('dot', $('stars'), { width: `${r}px`, height: `${r}px`, left: `${1150 + rnd(i, 22) * 900}px`, top: `${80 + rnd(i, 23) * 260}px`, background: '#9AA5BF', opacity: 0 }); });

// ---------- A · chart extras: hour ticks, rings, rays, particles ----------
const prod = $('prod'), PL = prod.getTotalLength(), useP = $('use'), fp = $('flowpath'), FL = fp.getTotalLength();
const TICKS = [[160, '6 am'], [510, '9 am'], [1210, '3 pm'], [1560, '6 pm'], [1680, '9 pm']].map(([x, l]) => { const d = mk('tick', $('ticks'), { left: `${x - 24}px`, top: '880px', opacity: 0 }); d.textContent = l; return { x, d }; });
const ringSet = (parent, n) => Array.from({ length: n }, () => mk('ring', parent, { opacity: 0 }));
const R_BIRTH = ringSet($('fx'), 3), R_NOON = ringSet($('fx'), 3), R_FULL = ringSet($('fx'), 3), R_LAND = ringSet($('fx'), 3), R_END = ringSet($('fx'), 3);
const RAYS = Array.from({ length: 14 }, () => mk('ray', $('fx'), { opacity: 0 }));
function rings(set, t, at, cx, cy, r0 = 100, r1 = 420, dur = 1.4) {
  set.forEach((d, i) => { const a = at + i * 0.16, p = progress(t, a, a + dur, ease.outCubic); const r = lerp(r0, r1, p); Object.assign(d.style, { left: `${cx - r}px`, top: `${cy - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, opacity: t < a ? 0 : (1 - p) * 0.7 }); });
}
function burst(t, at, cx, cy, r0 = 130, len = 120) {
  RAYS.forEach((d, i) => { const ang = (i / RAYS.length) * 360 + 8, p = progress(t, at, at + 0.7, ease.outExpo), q = progress(t, at + 0.25, at + 0.9, ease.inCubic); const r = r0 + p * 40; Object.assign(d.style, { left: `${cx + Math.cos(ang * Math.PI / 180) * r}px`, top: `${cy + Math.sin(ang * Math.PI / 180) * r}px`, width: `${len * p * (1 - q)}px`, transform: `rotate(${ang}deg)`, opacity: t < at ? 0 : 1 - q }); });
}
const PARTS = Array.from({ length: 150 }, (_, i) => { const r = 10 + rnd(i, 5) * 22; return { d: mk('dot', $('flow'), { width: `${r}px`, height: `${r}px`, marginLeft: `${-r / 2}px`, marginTop: `${-r / 2}px`, opacity: 0 }), off: rnd(i, 6), jit: (rnd(i, 7) - 0.5) * 46 }; });

// ---------- B · panel (flips in, cells pop in a wave, then light in a wave) ----------
function panelSVG() {
  const Q = [[222, 380], [604, 354], [632, 632], [198, 606]];
  const A = [], b = [];
  [[0, 0], [1, 0], [1, 1], [0, 1]].forEach(([u, v], i) => { const [x, y] = Q[i]; A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); b.push(x); A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); b.push(y); });
  const M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < 8; c++) { let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r; [M[c], M[p]] = [M[p], M[c]]; for (let r = 0; r < 8; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let q = c; q < 9; q++) M[r][q] -= f * M[c][q]; } }
  const h = M.map((r, i) => r[8] / r[i]);
  const P = (u, v) => { const w = h[6] * u + h[7] * v + 1; return [(h[0] * u + h[1] * v + h[2]) / w, (h[3] * u + h[4] * v + h[5]) / w]; };
  const pts = (L) => L.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const shades = ['#B6C3D9', '#BFCADE', '#AEBBD3', '#C5CFE1'];
  let svg = `<polygon points="${pts(Q)}" fill="#FFFFFF"/>`;
  for (let i = 0; i < 12; i++) for (let j = 0; j < 6; j++) { const g = 0.006, u0 = i / 12 + g, u1 = (i + 1) / 12 - g, v0 = j / 6 + g * 1.6, v1 = (j + 1) / 6 - g * 1.6; const cx = (P(u0, v0)[0] + P(u1, v1)[0]) / 2, cy = (P(u0, v0)[1] + P(u1, v1)[1]) / 2; svg += `<polygon class="cell" data-i="${i}" data-j="${j}" data-base="${shades[(i * 3 + j) % 4]}" style="transform-origin:${cx}px ${cy}px" points="${pts([P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)])}" fill="${shades[(i * 3 + j) % 4]}"/>`; }
  for (let i = 3; i < 12; i += 3) { const [a, c] = [P(i / 12, 0), P(i / 12, 1)]; svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#1F2328" stroke-width="1.2" opacity="0.55"/>`; }
  for (let j = 2; j < 6; j += 2) { const [a, c] = [P(0, j / 6), P(1, j / 6)]; svg += `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#1F2328" stroke-width="1.2" opacity="0.55"/>`; }
  svg += `<polygon points="${pts(Q)}" fill="none" stroke="#1F2328" stroke-width="3" stroke-linejoin="round"/>`;
  return svg;
}
$('panel').innerHTML = panelSVG();
const CELLS = [...document.querySelectorAll('#panel .cell')];
const PHOTONS = Array.from({ length: 36 }, (_, i) => ({ d: mk('dot', $('photons'), { width: '12px', height: '12px', marginLeft: '-6px', marginTop: '-6px', background: '#F2B66D', opacity: 0 }), off: rnd(i, 31), dy: (rnd(i, 32) - 0.5) * 30 }));
const SPARK = Array.from({ length: 10 }, () => mk('ray', $('spark'), { opacity: 0, background: '#F2B66D' }));

// ---------- C · streams ----------
const arc1 = $('arc1'), A1 = arc1.getTotalLength(), arc2 = $('arc2'), A2 = arc2.getTotalLength();
const STREAM = Array.from({ length: 120 }, (_, i) => { const r = 10 + rnd(i, 41) * 20; return { d: mk('dot', $('stream'), { width: `${r}px`, height: `${r}px`, marginLeft: `${-r / 2}px`, marginTop: `${-r / 2}px`, opacity: 0 }), off: rnd(i, 42), jit: (rnd(i, 43) - 0.5) * 40, z: (rnd(i, 44) - 0.5) * 260 }; });
const STREAM2 = Array.from({ length: 90 }, (_, i) => { const r = 9 + rnd(i, 51) * 18; return { d: mk('dot', $('stream2'), { width: `${r}px`, height: `${r}px`, marginLeft: `${-r / 2}px`, marginTop: `${-r / 2}px`, opacity: 0 }), off: rnd(i, 52), jit: (rnd(i, 53) - 0.5) * 36, z: (rnd(i, 54) - 0.5) * 220 }; });
function flowAlong(list, path, L, t, a, b, spread = 0.7) {
  const pour = progress(t, a, b);
  let lead = 0;
  list.forEach((p) => { const u = pour * (1 + spread) - p.off * spread, v = clamp(u), vis = u > 0 && u < 1 && pour > 0 && pour < 1;
    const pt = path.getPointAtLength(L * ease.inOutSine(v)); if (vis) lead = Math.max(lead, v);
    Object.assign(p.d.style, { left: `${pt.x}px`, top: `${pt.y + Math.sin(v * Math.PI) * p.jit}px`, opacity: vis ? Math.sin(v * Math.PI) * 0.9 + 0.1 : 0, transform: `translateZ(${(p.z ?? 0) * Math.sin(v * Math.PI)}px) scale(${vis ? lerp(0.4, 1, Math.sin(v * Math.PI)) : 0})` }); });
  return path.getPointAtLength(L * ease.inOutSine(clamp(pour * 1.25)));
}

// ---------- D · the home (builds itself) and the neighborhood ----------
$('home').innerHTML = `
  <svg class="abs" style="left:0;top:0;overflow:visible" width="520" height="520" viewBox="1150 390 520 520">
    <rect id="chim" x="1240" y="470" width="54" height="120" fill="#FFFFFF" stroke="#1F2328" stroke-width="2.5"/>
    <rect id="walls" x="1210" y="640" width="420" height="260" fill="#FFFFFF" stroke="#1F2328" stroke-width="2.5"/>
    <g id="roof"><path d="M 1166 652 L 1420 452 L 1674 652 L 1660 668 L 1420 478 L 1180 668 Z" fill="#E3E8F1" stroke="#1F2328" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 1200 640 L 1420 478 L 1640 640 Z" fill="#F2F4F8" stroke="#1F2328" stroke-width="2" stroke-linejoin="round"/><g id="roof-panels"></g></g>
    <path id="door" d="M 1388 900 L 1388 790 Q 1388 768 1410 768 L 1450 768 Q 1472 768 1472 790 L 1472 900" fill="#F2F4F8" stroke="#1F2328" stroke-width="2.5"/>
  </svg>
  <div id="hw1" class="win" style="left:102px;top:310px;width:100px;height:100px"></div>
  <div id="hw2" class="win" style="left:358px;top:310px;width:100px;height:100px"></div>`;
{ const A = [1448, 512], Bp = [1596, 624], C = [1566, 640], D = [1418, 528]; let g = ''; const P = (u, v) => [A[0] + (Bp[0] - A[0]) * u + (D[0] - A[0]) * v, A[1] + (Bp[1] - A[1]) * u + (D[1] - A[1]) * v]; const sh = ['#B6C3D9', '#BFCADE', '#AEBBD3', '#C5CFE1'];
  for (let i = 0; i < 6; i++) for (let j = 0; j < 2; j++) { const q = [P(i / 6 + 0.01, j / 2 + 0.04), P((i + 1) / 6 - 0.01, j / 2 + 0.04), P((i + 1) / 6 - 0.01, (j + 1) / 2 - 0.04), P(i / 6 + 0.01, (j + 1) / 2 - 0.04)]; g += `<polygon points="${q.map((p) => p.join(',')).join(' ')}" fill="${sh[(i + j) % 4]}"/>`; }
  $('roof-panels').innerHTML = g + `<polygon points="${[A, Bp, C, D].map((p) => p.join(',')).join(' ')}" fill="none" stroke="#1F2328" stroke-width="2"/>`; }
const HOODS = [4820, 5300, 5780, 6260].map((x, i) => {
  const h = mk('abs', $('hoods'), { left: `${x}px`, top: `${3230 - 250}px`, width: '300px', height: '250px', opacity: 0 });
  h.innerHTML = `<svg class="abs" style="left:0;top:0;overflow:visible" width="300" height="250"><rect x="20" y="100" width="260" height="150" fill="#FFFFFF" stroke="#1F2328" stroke-width="2.2"/><path d="M 0 108 L 150 0 L 300 108" fill="#EEF1F6" stroke="#1F2328" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
  const w = [mk('win', h, { left: '58px', top: '140px', width: '60px', height: '60px' }), mk('win', h, { left: '182px', top: '140px', width: '60px', height: '60px' })];
  return { h, w, x };
});

// ---------- kinetic words in the scene ----------
const chars = (el, text) => { el.innerHTML = [...text].map((c) => `<span class="ch">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); return [...el.children]; };
function kword(text, x, y, size, css = {}) { const el = mk('abs k', $('near'), { left: `${x}px`, top: `${y}px`, fontSize: `${size}px`, ...css }); return { el, cs: chars(el, text) }; }
function kin(w, t, at, { each = 0.035, dur = 0.7, dy = 60, rot = 8 } = {}) {
