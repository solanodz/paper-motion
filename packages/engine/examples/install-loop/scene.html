<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>install-loop</title>
<style>
  @font-face { font-family: 'GSerif'; src: url(./fonts/GeistSerif-Regular.woff2); }
  @font-face { font-family: 'GMono'; font-weight: 100 900; src: url(./fonts/GeistMono-Variable.woff2) format('woff2-variations'); }
  #stage { background: #000; overflow: hidden; }
  .abs { position: absolute; white-space: pre; box-sizing: border-box; }
</style>
</head>
<body>
<main id="stage">
  <!-- layout and shader values were read from a Paper canvas with get_jsx -->
  <div id="bg" class="abs" style="left:0;top:0;width:1600px;height:900px;background:#000"></div>
  <div id="name" class="abs" style="left:92px;top:520px;font-family:GSerif;font-size:200px;line-height:200px;letter-spacing:-0.02em;color:#fff">paper-motion</div>
  <div id="tag" class="abs" style="left:100px;top:790px;font-family:GMono;font-weight:400;font-size:26px;line-height:32px;color:#A3A3A3">creative-directed videos for people who use coding agents</div>
  <div id="cmd" class="abs" style="left:100px;top:72px;font-family:GMono;font-weight:500;font-size:20px;line-height:24px;color:#fff"></div>
  <div id="cur" class="abs" style="top:72px;width:11px;height:24px;background:#fff"></div>
</main>
<script type="module">
import { scene, progress } from 'paper-motion';

const s = scene({ width: 1600, height: 900, fps: 30, duration: 6, background: '#000' });
await Promise.all(['400 100px GSerif', '500 20px GMono'].map((f) => document.fonts.load(f)));

// The user's shader from Paper, with their note applied ("the sphere in gray").
s.shader('#bg', 'Dithering', { speed: 1, shape: 'sphere', type: '4x4', size: 2, scale: 0.6, colorBack: '#00000000', colorFront: '#A3A3A3' }, { loop: 1.2 });

// The install line types in, holds, then erases, so the loop closes on an empty prompt.
const CMD = '$ npx skills add solanodz/paper-motion', CW = 12.05;
const cmd = document.querySelector('#cmd'), cur = document.querySelector('#cur');
s.update((t) => {
  const typed = Math.floor(CMD.length * progress(t, 0.4, 1.7));
  const erased = Math.floor(CMD.length * progress(t, 5.0, 5.55));
  const n = Math.max(0, typed - erased);
  cmd.textContent = CMD.slice(0, n);
  cur.style.left = `${100 + n * CW + 2}px`;
  const typing = (t > 0.4 && t < 1.7) || (t > 5.0 && t < 5.55);
  cur.style.opacity = typing || Math.floor(t * 2) % 2 === 0 ? 1 : 0;
});
await s.start();
</script>
</body>
</html>
