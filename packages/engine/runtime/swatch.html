<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>swatch</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #s { position: absolute; inset: 0; }</style>
</head>
<body>
<div id="s"></div>
<script type="module">
// One background playing live, for the studio's small demos: the entry (shader, props, background) rides in the hash.
import { live } from 'paper-motion';
try {
  const e = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const el = document.getElementById('s');
  if (e.background) el.style.background = e.background;
  await live(el, e.shader, e.props ?? {});
} catch (err) { document.body.style.background = '#111'; console.warn(err); }
</script>
</body>
</html>
