<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brand sheet</title>
<!--
  The brand sheet: the whole brand on one page, built from the brand folder (one level up).
  Reads ../tokens.json, ../IDENTITY.md, ../VISUAL.md, ../MOTION.md, ../SOUND.md and, when they exist,
  ../motion.json, ../sound/sounds.json, ../shader-set/set.json. Sections without data are left out.
  This copy belongs to the user: edit copy, order or layout freely; `pamo sheet` re-exports it.
-->
<style>
  :root { --ground: #f2f2f2; --figure: #1a1a1a; --muted: #6b6b6b; --surface: #e4e4e4; --accent: #1a1a1a; --line: rgba(0,0,0,.12);
          --display: system-ui, sans-serif; --text: system-ui, sans-serif; --mono: ui-monospace, Menlo, monospace; --radius: 12px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--figure); font-family: var(--text); -webkit-font-smoothing: antialiased; }
  .wrap { width: min(1440px, 100%); margin: 0 auto; padding: 0 64px; }
  section { padding: 120px 0 140px; border-top: 1px solid var(--line); }
  .kicker { font: 500 14px/20px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
  h2 { font-family: var(--display); font-weight: var(--display-weight, 500); letter-spacing: var(--display-tracking, -0.02em); font-size: 80px; line-height: .98; margin: 0 0 56px; }
  h3 { font: 500 15px/20px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  p, li { font-size: 20px; line-height: 1.5; max-width: 62ch; }
  .md p:first-child { margin-top: 0; }
  .grid { display: grid; gap: 48px 64px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--surface); border-radius: var(--radius); padding: 32px; }

  /* cover */
  #cover { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 0 72px; border: 0; overflow: hidden; }
  #cover .field { position: absolute; inset: 0; opacity: .55; }
  #cover .top, #cover .bottom { position: relative; display: flex; justify-content: space-between; align-items: end; gap: 32px; }
  #cover .top { font: 500 14px/20px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  #cover .mark { position: relative; }
  #cover .mark img { display: block; width: min(80%, 1100px); height: auto; }
  #cover .mark .wm { font-family: var(--display); font-size: clamp(96px, 14vw, 240px); line-height: .9; letter-spacing: var(--display-tracking, -0.02em); font-weight: var(--display-weight, 500); }
  #cover .line { font-size: 28px; line-height: 1.3; max-width: 28ch; }
  #cover .keys { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { font: 500 14px/1 var(--mono); padding: 10px 14px; border: 1px solid currentColor; border-radius: var(--pill-radius, 999px); }

  /* identity */
  .sliders { display: grid; gap: 14px; }
  .slider { display: grid; grid-template-columns: 1fr 220px 1fr; align-items: center; gap: 16px; font-size: 17px; }
  .slider span:last-child { text-align: right; }
  .track { position: relative; height: 2px; background: var(--line); }
  .track i { position: absolute; top: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
  .voice { font-family: var(--display); font-size: 44px; line-height: 1.15; letter-spacing: var(--display-tracking, -0.01em); margin: 0; max-width: 24ch; }

  /* visual */
  .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .marks div { border: 1px solid var(--line); border-radius: var(--radius); padding: 64px 48px; display: flex; align-items: center; justify-content: center; min-height: 260px; }
  .marks img { max-width: 80%; max-height: 120px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .swatch .chip { height: 180px; border-radius: var(--radius); border: 1px solid var(--line); }
  .swatch b { display: block; font: 500 16px/22px var(--mono); margin-top: 14px; }
  .swatch small { font: 400 14px/20px var(--mono); color: var(--muted); }
  .ramp { display: flex; height: 64px; border-radius: var(--radius); overflow: hidden; margin-top: 24px; border: 1px solid var(--line); }
  .ramp div { flex: 1; }
  .spec { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: baseline; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .spec small { font: 400 14px/20px var(--mono); color: var(--muted); }

  /* motion, sound, shaders */
  .sample { font-family: var(--sample-font, var(--display)); font-size: 56px; letter-spacing: var(--display-tracking, -0.01em); min-height: 72px; }
  .sample .cur { display: inline-block; width: .5em; height: .9em; background: var(--figure); vertical-align: -0.1em; margin-left: 4px; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .clips figure { margin: 0; }
  .clips video { width: 100%; max-height: 520px; display: block; border-radius: var(--radius); background: #000; object-fit: contain; }
  .clips figcaption { font: 400 14px/20px var(--mono); color: var(--muted); margin-top: 10px; }
  .sounds { display: flex; gap: 12px; flex-wrap: wrap; }
  .sounds button { font: 500 15px/1 var(--mono); color: var(--figure); background: var(--surface); border: 0; border-radius: var(--pill-radius, 999px); padding: 14px 20px; cursor: pointer; }
  footer { padding: 48px 0 64px; border-top: 1px solid var(--line); font: 400 14px/20px var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
  @media print { section, #cover { break-inside: avoid; } }
  @media (max-width: 760px) { .wrap { padding: 0 20px; } h2 { font-size: 48px; } .slider { grid-template-columns: 1fr 120px 1fr; } .marks { grid-template-columns: 1fr; } .spec { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="sheet"></main>
<script type="module">
import { live, organicPath } from 'paper-motion';

const get = (p, json) => fetch(p).then((r) => (r.ok ? (json ? r.json() : r.text()) : null)).catch(() => null);
const [tokens, identity, visual, motionMd, soundMd, motion, sounds, shaders] = await Promise.all([
  get('../tokens.json', true), get('../IDENTITY.md'), get('../VISUAL.md'), get('../MOTION.md'), get('../SOUND.md'),
  get('../motion.json', true), get('../sound/sounds.json', true), get('../shader-set/set.json', true),
]).then((r) => { const set = r[7]; r[7] = (Array.isArray(set) ? set : set?.entries ?? []).filter((e) => e.video); return r; });

// ── markdown: split by "## " into sections, render the small subset brand files use ──
const sections = (md) => Object.fromEntries((md ?? '').split(/^## /m).slice(1).map((b) => { const i = b.indexOf('\n'); return [b.slice(0, i).trim(), b.slice(i + 1).trim()]; }));
const inline = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>').replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
// Group consecutive bullet lines into one list and other lines into paragraphs, whatever the blank lines.
const md = (s) => {
  const out = []; let para = [], list = [];
  const flush = () => { if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`); if (list.length) out.push(`<ul>${list.map((l) => `<li>${inline(l)}</li>`).join('')}</ul>`); para = []; list = []; };
  for (const l of (s ?? '').split('\n')) {
    if (!l.trim()) { flush(); continue; }
    const m = l.match(/^\s*[-*] (.*)/);
    if (m) { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } list.push(m[1]); }
    else { if (list.length) { out.push(`<ul>${list.map((x) => `<li>${inline(x)}</li>`).join('')}</ul>`); list = []; } para.push(l.trim()); }
  }
  flush();
  return out.join('');
};
const filled = (s) => s && s.trim() && s.trim() !== '—';
const I = sections(identity), V = sections(visual), M = sections(motionMd), S = sections(soundMd);

// ── brand tokens → CSS ──
const C = tokens?.colors ?? {};
const root = document.documentElement.style;
for (const k of ['ground', 'figure', 'muted', 'surface', 'accent']) if (C[k]?.hex) root.setProperty(`--${k}`, C[k].hex);
const fam = (k, fb) => (tokens?.fonts?.[k]?.family ? `'${tokens.fonts[k].family}', ${fb}` : fb);
root.setProperty('--display', fam('display', 'system-ui, sans-serif'));
root.setProperty('--text', fam('text', 'system-ui, sans-serif'));
root.setProperty('--mono', tokens?.fonts?.mono?.family ? fam('mono', 'ui-monospace, monospace') : fam('text', 'ui-monospace, Menlo, monospace'));
// shapes follow the brand: hard brands get square pills and buttons
root.setProperty('--pill-radius', tokens?.shape?.language === 'hard' ? `${tokens.shape.radius ?? 0}px` : tokens?.shape?.language === 'organic' ? `${tokens.shape.radius ?? 12}px` : '999px');
if (tokens?.type?.display) { root.setProperty('--display-weight', tokens.type.display.weight); root.setProperty('--display-tracking', tokens.type.display.tracking); }
if (tokens?.shape?.radius !== undefined) root.setProperty('--radius', `${tokens.shape.radius}px`);
root.setProperty('--line', `color-mix(in oklab, var(--figure) 14%, transparent)`);
await Promise.all(Object.values(tokens?.fonts ?? {}).filter((f) => f?.css).map((f) => new Promise((res) => document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: f.css, onload: res, onerror: res })))));
// Fonts the brand ships as files (licensed by the user, or bundled) load as @font-face from the brand folder.
for (const f of Object.values(tokens?.fonts ?? {})) if (f?.file) document.head.append(Object.assign(document.createElement('style'), { textContent: `@font-face { font-family: '${f.family}'; src: url('../${f.file}'); font-weight: 100 900; }` }));

const name = tokens?.brand ?? (identity?.match(/^# (.+?)(?: ·|$)/m)?.[1] ?? 'brand');
document.title = `${name} · brand sheet`;
const dark = tokens?.mode === 'dark';
const wmFile = tokens?.wordmark?.files?.[dark ? 'onDark' : 'onLight'];
const firstOf = (...keys) => keys.map((k) => I[k]).find(filled) ?? '';
const keywords = (I.Keywords ?? '').split(/[,\n·]/).map((s) => s.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
// The sheet speaks the brand's language (IDENTITY.md · Voice names it) and follows its casing.
const L10N = {
  en: { identity: 'identity', visual: 'visual system', motion: 'motion', sound: 'sound', set: 'shader set', who: (n) => `Who ${n} is`, looks: (n) => `How ${n} looks`, moves: (n) => `How ${n} moves`, sounds: (n) => `How ${n} sounds`, materials: (k) => `${k} moving materials`,
        offer: 'offer', audience: 'audience', personality: 'personality', voice: 'voice', not: 'not', references: 'references', wordmark: 'wordmark', palette: 'palette', type: 'type', shape: 'shape', rules: 'rules', movesL: 'moves', sheet: 'brand sheet', made: 'made with paper-motion' },
  es: { identity: 'identidad', visual: 'sistema visual', motion: 'movimiento', sound: 'sonido', set: 'set de shaders', who: (n) => `Quién es ${n}`, looks: (n) => `Cómo se ve ${n}`, moves: (n) => `Cómo se mueve ${n}`, sounds: (n) => `Cómo suena ${n}`, materials: (k) => `${k} materiales en movimiento`,
        offer: 'qué ofrece', audience: 'para quién', personality: 'personalidad', voice: 'voz', not: 'qué no es', references: 'referencias', wordmark: 'wordmark', palette: 'paleta', type: 'tipografía', shape: 'forma', rules: 'reglas', movesL: 'movimientos', sheet: 'página de identidad', made: 'hecho con paper-motion' },
  pt: { identity: 'identidade', visual: 'sistema visual', motion: 'movimento', sound: 'som', set: 'shaders', who: (n) => `Quem é ${n}`, looks: (n) => `Como ${n} se vê`, moves: (n) => `Como ${n} se move`, sounds: (n) => `Como ${n} soa`, materials: (k) => `${k} materiais em movimento`,
        offer: 'oferta', audience: 'público', personality: 'personalidade', voice: 'voz', not: 'o que não é', references: 'referências', wordmark: 'wordmark', palette: 'paleta', type: 'tipografia', shape: 'forma', rules: 'regras', movesL: 'movimentos', sheet: 'página de marca', made: 'feito com paper-motion' },
};
const voiceText = I.Voice ?? '';
const lang = tokens?.language ?? (/\b(spanish|español|castellano)\b/i.test(voiceText) ? 'es' : /portugu/i.test(voiceText) ? 'pt' : 'en');
const Tx = L10N[lang] ?? L10N.en;
const lower = (tokens?.wordmark?.text ?? '') && tokens.wordmark.text === tokens.wordmark.text.toLowerCase();
if (lower) document.head.append(Object.assign(document.createElement('style'), { textContent: 'h2, .kicker, h3, #cover .top { text-transform: lowercase; }' }));
const html = [];

// ── cover ──
html.push(`<section id="cover"><div class="field"></div><div class="wrap top"><span>${inline(name)} · ${Tx.sheet}</span><span>${new Date().toISOString().slice(0, 10)}</span></div>
  <div class="wrap mark"><div class="wm" style="font-family:var(--${tokens?.wordmark?.font ?? 'display'});font-weight:${tokens?.wordmark?.weight ?? 'var(--display-weight, 500)'};letter-spacing:${tokens?.wordmark?.tracking ?? 'var(--display-tracking, -0.02em)'};margin-bottom:48px">${inline(tokens?.wordmark?.text ?? name)}</div></div>
  <div class="wrap bottom"><div class="line">${inline(firstOf('In one line').split('\n')[0])}</div><div class="keys">${keywords.map((k) => `<span class="pill">${inline(k)}</span>`).join('')}</div></div></section>`);

// ── identity ──
if (identity) {
  const sliders = (I.Personality ?? '').split('\n').map((l) => l.match(/^[-*\s]*(.+?)\s+([●○]{3,})\s+(.+)$/)).filter(Boolean);
  const voiceLine = (I.Voice ?? '').match(/[“"]([^”"]+)[”"]/)?.[1];
  html.push(`<section><div class="wrap"><div class="kicker">01 · ${Tx.identity}</div><h2>${Tx.who(inline(name))}</h2><div class="grid">
    ${filled(firstOf('Offer', 'Purpose')) ? `<div><h3>${Tx.offer}</h3><div class="md">${md(firstOf('Offer', 'Purpose'))}</div></div>` : ''}
    ${filled(I.Audience) ? `<div><h3>${Tx.audience}</h3><div class="md">${md(I.Audience)}</div></div>` : ''}
    ${sliders.length ? `<div><h3>${Tx.personality}</h3><div class="sliders">${sliders.map(([, a, dots, b]) => `<div class="slider"><span>${inline(a)}</span><div class="track"><i style="left:${(((dots.match(/●/g) ?? []).length > 1 ? dots.lastIndexOf('●') : dots.indexOf('●')) / Math.max(1, dots.length - 1)) * 100}%"></i></div><span>${inline(b)}</span></div>`).join('')}</div></div>` : ''}
    ${filled(I.Voice) ? `<div><h3>${Tx.voice}</h3>${voiceLine ? `<p class="voice">“${inline(voiceLine)}”</p>` : `<div class="md">${md(I.Voice)}</div>`}</div>` : ''}
    ${filled(I.Not) ? `<div><h3>${Tx.not}</h3><div class="md">${md(I.Not)}</div></div>` : ''}
    ${filled(I.References) ? `<div><h3>${Tx.references}</h3><div class="md">${md(I.References)}</div></div>` : ''}
  </div></div></section>`);
}

// ── visual system ──
if (tokens) {
  const sw = Object.entries(C).map(([role, c]) => `<div class="swatch"><div class="chip" style="background:${c.hex}"></div><b>${role} · ${c.hex}</b><small>${inline(c.role ?? '')}</small></div>`).join('');
  const T = tokens.type ?? {};
  const specimen = (role, sample) => T[role] ? `<div class="spec"><small>${role}<br>${tokens.fonts?.[T[role].font]?.family ?? ''} ${T[role].weight} · ${T[role].size}px</small><div style="font-family:var(--${T[role].font === 'mono' ? 'mono' : T[role].font});font-weight:${T[role].weight};font-size:${Math.min(T[role].size, 160)}px;line-height:${T[role].lineHeight};letter-spacing:${T[role].tracking}">${sample}</div></div>` : '';
  const short = (t, n) => (t.length <= n ? t : `${t.slice(0, t.lastIndexOf(' ', n))}…`);
  const line1 = inline(short((firstOf('In one line') || name).split('\n')[0], 34));
  const body = inline(short((firstOf('Offer', 'Purpose', 'Audience') || `${name}, set in its text face at body size, the way most of its words will be read.`).split('\n')[0], 180));
  const caption = inline(keywords.length ? keywords.join(' · ') : Object.keys(C).join(' · '));
  const on = tokens.wordmark?.files ?? {};
  html.push(`<section><div class="wrap"><div class="kicker">02 · ${Tx.visual}</div><h2>${Tx.looks(inline(name))}</h2>
    ${on.onLight || on.onDark ? `<h3>${Tx.wordmark}</h3><div class="marks">${on.onLight ? `<div style="background:${dark ? C.figure?.hex : C.ground?.hex}"><img src="../${on.onLight}"></div>` : ''}${on.onDark ? `<div style="background:${dark ? C.ground?.hex : C.figure?.hex}"><img src="../${on.onDark}"></div>` : ''}</div><br><br>` : ''}
    <h3>${Tx.palette}</h3><div class="swatches">${sw}</div>
    ${tokens.ramp?.length ? `<div class="ramp">${tokens.ramp.map((h) => `<div style="background:${h}"></div>`).join('')}</div>` : ''}
    <br><br><h3>${Tx.type}</h3>${specimen('display', inline(tokens.wordmark?.text ?? name))}${specimen('title', line1)}${specimen('body', body)}${specimen('caption', caption)}
    ${tokens.shape ? `<br><br><h3>${Tx.shape} · ${tokens.shape.language}</h3><svg width="420" height="260" style="display:block"><path id="shape" fill="var(--surface)" stroke="var(--figure)" stroke-width="${tokens.shape.stroke ?? 1}"/></svg>` : ''}
    ${filled(V.Rules) ? `<br><br><h3>${Tx.rules}</h3><div class="md">${md(V.Rules)}</div>` : ''}
  </div></section>`);
}

// ── motion ──
if (motionMd || motion) {
  html.push(`<section><div class="wrap"><div class="kicker">03 · ${Tx.motion}</div><h2>${Tx.moves(inline(name))}</h2>
    <div class="sample" id="sample"></div><br>
    <div class="grid">${Object.entries(M).filter(([k, v]) => filled(v) && k !== 'Open').map(([k, v]) => `<div><h3>${inline(k.toLowerCase())}</h3><div class="md">${md(v)}</div></div>`).join('')}</div>
    ${motion?.moves?.length ? `<br><br><h3>${Tx.movesL}</h3><div class="clips">${motion.moves.map((m) => `<figure><video src="../${m.video}" muted loop autoplay playsinline></video><figcaption>${inline(m.name)}</figcaption></figure>`).join('')}</div>` : ''}
  </div></section>`);
}

// ── sound ──
if (soundMd || sounds) {
  html.push(`<section><div class="wrap"><div class="kicker">04 · ${Tx.sound}</div><h2>${Tx.sounds(inline(name))}</h2>
    ${sounds?.length ? `<div class="sounds">${sounds.map((s, i) => `<button data-i="${i}">▶ ${inline(s.name)}</button>`).join('')}</div><br><br>` : ''}
    <div class="grid">${Object.entries(S).filter(([k, v]) => filled(v) && k !== 'Open').map(([k, v]) => `<div><h3>${inline(k.toLowerCase())}</h3><div class="md">${md(v)}</div></div>`).join('')}</div>
  </div></section>`);
}

// ── shader set ──
if (shaders?.length) {
  html.push(`<section><div class="wrap"><div class="kicker">05 · ${Tx.set}</div><h2>${Tx.materials(shaders.length)}</h2>
    <div class="clips">${shaders.map((s) => `<figure><video src="../shader-set/${s.video}" muted loop autoplay playsinline></video><figcaption>${inline(s.id)}</figcaption></figure>`).join('')}</div></div></section>`);
}

html.push(`<footer class="wrap"><span>${inline(name)}</span><span>${Tx.made}</span></footer>`);
document.querySelector('#sheet').innerHTML = html.join('');

// ── live parts ──
const shapeEl = document.querySelector('#shape');
if (shapeEl) {
  const L = tokens.shape.language, r = tokens.shape.radius ?? 0;
  shapeEl.setAttribute('d', L === 'organic' ? organicPath(400, 240, { radius: r, seed: 2 }) : `M${r},0 H${400 - r} Q400,0 400,${r} V${240 - r} Q400,240 ${400 - r},240 H${r} Q0,240 0,${240 - r} V${r} Q0,0 ${r},0 Z`);
  shapeEl.setAttribute('transform', 'translate(10,10)');
}
// the cover field stays in the brand's grounds (ground, surface, the ramp's first step): the accent is a moment, never a cover
const field = [C.ground?.hex, C.surface?.hex ?? tokens?.ramp?.[1], tokens?.ramp?.[1] ?? C.muted?.hex, C.ground?.hex].filter(Boolean);
if (field.length >= 2) await live(document.querySelector('#cover .field'), 'MeshGradient', { colors: field, distortion: 0.5, swirl: 0.15, speed: 0.12, grainOverlay: 0.06 }).catch(() => {});
const sample = document.querySelector('#sample');
if (sample) {
  const voiceQuote = (I.Voice ?? '').match(/[“"]([^”"]{4,90})[”"]/)?.[1];
  const text = (firstOf('In one line').split('\n')[0] || voiceQuote || tokens?.wordmark?.text || name).replace(/[*`]/g, '');
  const mode = motion?.text ?? (/typ/i.test(motionMd ?? '') ? 'typing' : 'reveal');
  if (mode === 'typing') { sample.style.setProperty('--sample-font', tokens?.fonts?.mono ? 'var(--mono)' : 'var(--text)'); sample.style.fontSize = '44px'; }
  let t0 = performance.now();
  const tick = (now) => {
    const t = ((now - t0) / 1000) % (text.length / 18 + 3);
    if (mode === 'typing') { const n = window.__export ? text.length : Math.min(text.length, Math.floor(t * 18)); sample.innerHTML = `${inline(text.slice(0, n))}<span class="cur" style="opacity:${n < text.length || Math.floor(t * 2) % 2 ? 1 : 0}"></span>`; }
    else { const p = Math.min(1, t / 1.2); sample.textContent = text; sample.style.opacity = p; sample.style.transform = `translateY(${(1 - p) * 16}px)`; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
document.querySelectorAll('.sounds button').forEach((b) => b.addEventListener('click', () => new Audio(`../sound/${sounds[b.dataset.i].file}`).play()));

await Promise.all([...new Set(Object.values(tokens?.fonts ?? {}).filter(Boolean).map((f) => f.family))].map((f) => document.fonts.load(`400 32px '${f}'`).catch(() => {})));
await document.fonts.ready;
window.__sheetReady = true;
</script>
</body>
</html>
