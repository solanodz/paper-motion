<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>move demo</title>
<!--
  A 7 s demo of one motion style in the brand's look: frames alternate (the name, then a line in the brand's
  words) at the chosen pace, so the clip shows rhythm, not one move. Reads /brand/tokens.json and
  /brand/IDENTITY.md: render it from the project root. Edit freely: it is a sketch for a board.
-->
<style>
  #stage { overflow: hidden; }
  #world { position: absolute; inset: 0; }
  .frame { position: absolute; top: 0; width: 1600px; height: 900px; display: flex; flex-direction: column; justify-content: center; padding: 0 140px; box-sizing: border-box; }
  .name { white-space: nowrap; }
  .cur { display: inline-block; width: 0.5em; height: 0.95em; vertical-align: -0.12em; margin-left: 4px; }
</style>
</head>
<body>
<main id="stage"><div id="world"></div></main>
<script type="module">
import { scene, ease, clamp } from 'paper-motion';
import * as M from 'paper-motion/moves';

// The four choices this demo shows. `pamo new <name> --move … --pace … --text … --camera …` sets them.
const MOVE = 'crossfade'; // transition between frames: cut crossfade wipe push maskReveal scanReveal zoomThrough
const PACE = 'medium';    // calm | medium | fast
const TEXT = 'plain';     // how the line appears: typing | rise | blur | track | plain
const CAMERA = 'still';   // still | drift | travel (travel moves the camera between frames and replaces MOVE)
const SOUND = 'none';     // sound palette: none | soft | crisp | airy (subtle swells) | ambient (airy over a low bed)
const DURATION = 7;

const tokens = await fetch('/brand/tokens.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
const identity = await fetch('/brand/IDENTITY.md').then((r) => (r.ok ? r.text() : '')).catch(() => '');
const C = tokens?.colors ?? {};
const col = (role, fb) => C[role]?.hex ?? fb;
const fam = (k, fb) => (tokens?.fonts?.[k]?.family ? `'${tokens.fonts[k].family}', ${fb}` : fb);
await Promise.all(Object.values(tokens?.fonts ?? {}).filter((f) => f?.css).map((f) => new Promise((res) => document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: f.css, onload: res, onerror: res })))));
for (const f of Object.values(tokens?.fonts ?? {})) if (f?.file) document.head.append(Object.assign(document.createElement('style'), { textContent: `@font-face { font-family: '${f.family}'; src: url('/brand/${f.file}'); font-weight: 100 900; }` }));

// The brand's own words: its one line, else the voice sample, else the first sentence of its offer.
const section = (h) => (identity.split(new RegExp(`^## ${h}\\s*$`, 'm'))[1] ?? '').split(/^## /m)[0].trim();
const firstLine = (s) => s.split('\n').map((l) => l.replace(/^[-*]\s*/, '').trim()).find(Boolean) ?? '';
const quoted = section('Voice').match(/[“"]([^”"]{4,90})[”"]/)?.[1];
const name = tokens?.wordmark?.text ?? tokens?.brand ?? 'brand';
const line = firstLine(section('In one line')) || quoted || firstLine(section('Offer') || section('Purpose')).split(/(?<=\.)\s/)[0] || name;

// Two frames that contrast enough for every move to read: ground, and figure (or a surface far from ground).
const lum = (hex) => { const n = parseInt((hex ?? '#888').slice(1), 16); return ((n >> 16 & 255) * 0.299 + (n >> 8 & 255) * 0.587 + (n & 255) * 0.114) / 255; };
const ground = col('ground', '#f2f2f2'), figure = col('figure', '#1a1a1a'), surface = C.surface?.hex;
const bBg = surface && Math.abs(lum(surface) - lum(ground)) > 0.25 ? surface : figure;
const bInk = bBg === figure ? ground : figure;

const T = tokens?.type ?? {};
const s = scene({ width: 1600, height: 900, fps: 30, duration: DURATION, background: ground });
const world = document.getElementById('world');
const mk = (i, kind) => {
  const el = document.createElement('div'); el.className = 'frame';
  el.style.left = CAMERA === 'travel' ? `${i * 1600}px` : '0';
  el.style.background = kind === 'name' ? ground : bBg; el.style.color = kind === 'name' ? figure : bInk;
  if (kind === 'name') {
    el.innerHTML = '<div class="name"></div>';
    Object.assign(el.firstChild.style, { font: `${T.display?.weight ?? 600} 220px ${fam('display', 'system-ui, sans-serif')}`, letterSpacing: T.display?.tracking ?? '-0.02em', lineHeight: 0.95 });
    el.firstChild.textContent = name;
  } else {
    el.innerHTML = '<div><span class="ln"></span><span class="cur"></span></div>';
    Object.assign(el.firstChild.style, { font: `${T.title?.weight ?? 500} 80px/1.08 ${fam('display', 'system-ui, sans-serif')}`, letterSpacing: T.title?.tracking ?? '-0.01em', maxWidth: '1300px' });
    el.querySelector('.ln').textContent = line;
    el.querySelector('.cur').style.background = bInk; el.querySelector('.cur').style.opacity = 0;
  }
  world.append(el);
  return el;
};

// Beats: name, line, name, line… each holds for the pace, then the move carries it to the next.
const P = M.PACE[PACE], trans = P.enter * 1.6, textDur = P.enter * 1.6;
const beats = [];
for (let t = 0.3, i = 0; t < DURATION; i++) {
  const kind = i % 2 ? 'line' : 'name';
  const hold = kind === 'line' ? textDur + P.hold : P.hold * 0.7;
  beats.push({ kind, start: t, end: t + hold, el: mk(i, kind) });
  t += hold + trans;
}
beats.forEach((b, i) => { b.el.style.opacity = i === 0 ? 1 : 0; });
const cps = { calm: 18, medium: 28, fast: 42 }[PACE];

s.update((t) => {
  // Every frame is derived from t alone: reset, then apply only the transition in progress (or last finished).
  for (const b of beats) Object.assign(b.el.style, { opacity: CAMERA === 'travel' ? 1 : 0, transform: '', maskImage: '', webkitMaskImage: '', clipPath: '' });
  let k = -1;
  beats.forEach((b, i) => { if (beats[i + 1] && t >= b.end) k = i; });
  const p = k < 0 ? 0 : clamp((t - beats[k].end) / trans);
  const drift = CAMERA === 'drift' ? ` scale(${1 + 0.05 * t / DURATION})` : '';
  if (CAMERA === 'travel') world.style.transform = `translateX(${-(Math.max(0, k) + (k < 0 ? 0 : ease.inOutCubic(p))) * 1600}px)`;
  else {
    world.style.transform = drift.trim();
    if (k < 0) beats[0].el.style.opacity = 1;
    else {
      const a = beats[k].el, b = beats[k + 1].el;
      ({ cut: () => M.cut(a, b, p >= 0.5 ? 1 : 0), crossfade: () => M.crossfade(a, b, p), wipe: () => M.wipe(a, b, p),
         push: () => M.push(a, b, p), maskReveal: () => M.maskReveal(a, b, p), scanReveal: () => M.scanReveal(a, b, p),
         zoomThrough: () => M.zoomThrough(a, b, p, { origin: beats[k].kind === 'name' ? '30% 50%' : '50% 50%' }) })[MOVE]?.();
    }
  }
  // the line appears as its frame lands
  for (const b of beats.filter((x) => x.kind === 'line')) {
    const el = b.el.querySelector('.ln'), start = b.start - (CAMERA === 'travel' ? 0 : trans * 0.3);
    if (TEXT === 'typing') M.typeOn(el, line, t, { times: M.typingTimes(line, { start, cps: cps * 0.4, seed: beats.indexOf(b) + 1 }), cursor: t < b.end + trans ? b.el.querySelector('.cur') : null });
    else if (TEXT === 'rise') M.wordRise(el, t, { start, each: P.stagger, duration: textDur });
    else if (TEXT === 'blur') M.blurIn(el, t, { start, duration: textDur });
    else if (TEXT === 'track') M.trackIn(el, t, { start, duration: textDur * 1.2 });
  }
});

// ── sound palette: one cue family per gesture (transition, landing, text), all low and soft ──
const PAL = {
  soft:  { lowpass: 1800, move: (t) => s.sfx(t, 'whoosh', { dur: Math.min(1.4, Math.max(0.4, trans * 1.4)), from: 220, to: 700, peak: 0.6, gain: 0.2, body: 0.4 }), land: (t) => s.sfx(t, 'thud', { freq: 55, gain: 0.22, decay: 0.45 }), text: (t) => s.sfx(t, 'paper', { dur: 0.5, gain: 0.035 }) },
  crisp: { lowpass: 4200, move: (t) => { s.sfx(t, 'flick', { gain: 0.12 }); s.sfx(t + 0.02, 'tick', { freq: 320, gain: 0.07, decay: 0.03 }); }, land: (t) => s.sfx(t, 'knock', { freq: 160, gain: 0.16, decay: 0.08 }), text: (t) => s.sfx(t, 'tick', { freq: 260, gain: 0.05, decay: 0.04 }) },
  airy:  { lowpass: 2000, move: (t) => s.sfx(t - 0.2, 'swell', { dur: Math.max(1.4, trans * 2.2), freq: 73.4, gain: 0.045 }), land: () => {}, text: (t) => s.sfx(t, 'paper', { dur: 0.6, gain: 0.025 }) },
  ambient: { lowpass: 2000, bed: () => s.sfx(0, 'drone', { dur: DURATION, freq: 55, gain: 0.04, attack: 1.5, release: 1.5 }), move: (t) => s.sfx(t - 0.2, 'swell', { dur: Math.max(1.4, trans * 2.2), freq: 73.4, gain: 0.05 }), land: () => {}, text: (t) => s.sfx(t, 'paper', { dur: 0.6, gain: 0.03 }) },
}[SOUND];
if (PAL) {
  PAL.bed?.();
  const bank = await fetch('/brand/sound/keys/keys.json').then((r) => (r.ok ? 'brand/sound/keys' : null)).catch(() => null);
  beats.forEach((b, i) => {
    if (beats[i + 1]) { PAL.move(b.end); PAL.land(b.end + trans); }
    if (b.kind === 'line') {
      const start = b.start - (CAMERA === 'travel' ? 0 : trans * 0.3);
      if (TEXT === 'typing') M.keySounds(s, line, M.typingTimes(line, { start, cps: cps * 0.4, seed: i + 1 }), { bank, seed: i + 1 });
      else PAL.text(start);
    }
  });
  s.sound({ lowpass: PAL.lowpass, gain: 1 });
}

await Promise.all([...document.querySelectorAll('.name, .frame > div')].map((el) => { const c = getComputedStyle(el); return document.fonts.load(`${c.fontWeight} ${c.fontSize} ${c.fontFamily}`); }));
await s.start();
</script>
</body>
</html>
