<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-motion studio</title>
<!--
  pamo studio: one piece in three steps. What it says (the brief and the content the user keeps), Your video (every
  part playing live, edited in place: words, how it arrives, background, settings, length, transitions, order, adding,
  swapping, removing, and the whole video's style) and Export. Reads /api/piece, writes edits back; the files stay the
  source of truth and the agent reads every change as one line. paper-motion's own look: black ground, white figure,
  one warm paper accent, hard edges, 1px rules.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Geist Serif'; src: url('/fonts/GeistSerif-Regular.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Geist Pixel'; src: url('/fonts/GeistPixel-Square.woff2') format('woff2'); font-display: swap; }
  :root { --ground: #000; --surface: #0b0b0b; --raised: #141414; --line: #1f1f1f; --rule: #3a3a3a; --figure: #fff; --muted: #8a8a8a; --faint: #4a4a4a; --paper: #e9e4d8; --ok: #3ddc84; --warn: #ff4d2e;
    --serif: 'Geist Serif', Georgia, serif; --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; --pixel: 'Geist Pixel', 'Geist Mono', monospace; }
  * { box-sizing: border-box; border-radius: 0; }
  html { background: var(--ground); color-scheme: dark; }
  body { margin: 0; background: var(--ground); color: var(--figure); font: 14px/1.45 var(--sans); }
  ::selection { background: var(--paper); color: #000; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; } a { color: inherit; }
  :focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .muted { color: var(--muted); } .mono { font-family: var(--mono); } .serif { font-family: var(--serif); font-weight: 400; }
  .ico { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: square; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--rule); background: transparent; padding: 8px 13px; font-size: 13px; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: var(--paper); }
  .btn.primary { background: var(--paper); color: #000; border-color: var(--paper); }
  .btn.primary:hover { background: #fff; border-color: #fff; }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; }
  .btn.on { background: var(--paper); color: #000; border-color: var(--paper); }
  .btn:disabled { opacity: .35; cursor: default; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
  .lbl { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  header.top { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; background: var(--ground); }
  .back { display: flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .ttl { font: 400 21px/1 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
  .steps { display: flex; margin: 0 auto; border: 1px solid var(--rule); }
  .steps button { background: none; border: 0; padding: 9px 16px; display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .steps button + button { border-left: 1px solid var(--rule); }
  .steps button b { font: 400 15px/1 var(--pixel); }
  .steps button.on { background: var(--paper); color: #000; }
  .steps button i { width: 7px; height: 7px; background: var(--ok); display: inline-block; }
  .turn { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 6px 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .turn .mk { width: 8px; height: 8px; background: var(--paper); flex: none; }
  .turn.agent .mk { background: var(--muted); animation: pulse 1.4s infinite; } .turn.off .mk, .turn.deaf .mk { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .3; } }
  .turn b { font-weight: 500; margin-right: 8px; } .turn .tx { color: var(--muted); }
  .turn .grow { flex: 1; }
  .turn.asking { background: #15130f; } .turn .q { font: 400 16px/1.3 var(--serif); margin-left: 4px; }
  .turn .ans { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .turn .ans input { width: 300px; background: var(--surface); border: 1px solid var(--rule); padding: 7px 10px; }
  .turn .ans input:focus { outline: none; border-color: var(--paper); }
  .look { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; max-width: 1360px; margin: 0 auto; padding: 28px 22px 110px; }
  .lkpv { position: sticky; top: 112px; align-self: start; }
  .lkbox { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); overflow: hidden; }
  .lkbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .lkbox .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .lkagain { position: absolute; right: 10px; bottom: 10px; z-index: 2; background: rgba(0,0,0,.7); border: 1px solid var(--rule); padding: 6px 10px; font-size: 12.5px; }
  .lkopts h1 { font: 400 40px/1.05 var(--serif); margin: 0; } .lkopts .sub { color: var(--muted); margin: 8px 0 4px; }
  .lkopts section { border-top: 1px solid var(--line); padding: 18px 0 20px; margin-top: 14px; }
  .lkopts h2 { font: 400 22px/1.1 var(--serif); margin: 0 0 12px; }
  .lkg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .lkc { position: relative; padding: 0; border: 1px solid var(--line); background: var(--surface); text-align: left; overflow: hidden; }
  .lkc:hover { border-color: var(--rule); } .lkc.on { border-color: var(--paper); outline: 1px solid var(--paper); }
  .lkf { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111 center / cover; }
  .lkf img, .lkf video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lkf .yours { position: absolute; left: 6px; top: 6px; background: var(--paper); color: #000; font: 500 10px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 5px; }
  .lkn { padding: 7px 9px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
  .sw { position: absolute; inset: 0; display: grid; place-items: center; } .sw b { font-size: 30px; font-weight: 400; } .sw i { position: absolute; left: 0; right: 0; bottom: 0; height: 18%; }
  .spec { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; padding: 6px; } .spec b { font-size: 30px; font-weight: 400; line-height: 1; } .spec span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lkcols { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; } .lkcols label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .lkcols input { width: 34px; height: 26px; border: 1px solid var(--rule); background: none; padding: 0; }
  .seg { display: inline-flex; border: 1px solid var(--rule); } .seg button { background: none; border: 0; padding: 7px 13px; color: var(--muted); } .seg button + button { border-left: 1px solid var(--rule); } .seg button.on { background: var(--paper); color: #000; }
  .steps button:disabled { opacity: .35; cursor: default; }
  .agentsug { margin: 4px 0 16px; padding: 12px; border: 1px solid var(--paper); background: #15130f; }
  .agentnote { font-size: 13px; margin-bottom: 4px; } .agentnote b { font-weight: 500; }
  .sugb { position: absolute; left: 6px; top: 6px; z-index: 2; background: var(--paper); color: #000; font: 500 10px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 5px; }
  .chnote { margin: 0; padding: 0 9px 9px; font-size: 12px; color: var(--muted); }
  .agentsug .none { display: flex; gap: 8px; margin-top: 10px; } .agentsug .none input { flex: 1; background: var(--surface); border: 1px solid var(--rule); padding: 6px 9px; }
  .beats { position: absolute; inset: 0; padding: 26px 9px 6px; display: grid; gap: 2px; align-content: start; font-size: 11px; overflow: hidden; } .beats span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); } .beats b { color: var(--figure); font-weight: 500; }
  .kitf { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); } .kitf > * { width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; font-size: 26px; font-weight: 400; }
  .steps .sdot { width: 7px; height: 7px; background: var(--warn); display: inline-block; margin-left: 4px; }
  .center .agentsug { max-width: 980px; }
  .nbadge { background: var(--warn); color: #000; font: 500 11px/1 var(--mono); padding: 3px 5px; }
  main { min-height: calc(100vh - 97px); }

  /* 1 · what it says */
  .what { max-width: 900px; margin: 0 auto; padding: 36px 20px 90px; }
  .what h1 { font: 400 46px/1.05 var(--serif); margin: 0; }
  .what .sub { margin: 10px 0 26px; color: var(--muted); font-size: 15px; max-width: 62ch; }
  .brief { border: 1px solid var(--line); margin-bottom: 30px; }
  .brief summary { cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; list-style: none; }
  .brief summary::-webkit-details-marker { display: none; }
  .brief .rows { padding: 0 14px 14px; display: grid; gap: 10px; }
  .brief .row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: baseline; }
  .edit { padding: 5px 8px; margin: -5px -8px; outline: 1px dashed transparent; cursor: text; min-height: 1.4em; }
  .edit:hover { outline-color: var(--rule); } .edit:focus { outline: 1px solid var(--paper); background: var(--surface); }
  .edit:empty::before { content: attr(data-placeholder); color: var(--faint); }
  .fact { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .fact:last-of-type { border-bottom: 1px solid var(--line); }
  .fact img { width: 96px; height: 60px; object-fit: cover; object-position: top; border: 1px solid var(--rule); }
  .fact .k { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .fact .k .new { background: var(--paper); color: #000; padding: 3px 5px; }
  .fact .t { font: 400 23px/1.2 var(--serif); margin-top: 6px; overflow-wrap: anywhere; }
  .fact .s { font-size: 12.5px; color: var(--faint); margin-top: 4px; }
  .fact.out { opacity: .38; } .fact.out .t { text-decoration: line-through; }
  .fact .acts { display: flex; gap: 6px; }
  .addfact { margin-top: 16px; display: flex; gap: 8px; }
  .addfact input, .addfact select { background: var(--surface); border: 1px solid var(--rule); padding: 10px 12px; }
  .addfact input { flex: 1; }
  .nextbar { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }

  /* 2 · your video */
  .editor { display: grid; grid-template-columns: 272px minmax(0, 1fr) 372px; min-height: calc(100vh - 97px); }
  .scenes { border-right: 1px solid var(--line); padding: 14px 12px 40px; overflow-y: auto; max-height: calc(100vh - 97px); position: sticky; top: 97px; }
  .scenes .part { width: auto; display: grid; grid-template-columns: 22px 104px minmax(0, 1fr); gap: 9px; align-items: center; padding: 7px; margin-bottom: 6px; }
  .scenes .part .n { position: static; background: none; padding: 0; font-size: 15px; color: var(--muted); }
  .scenes .part .th { width: 104px; border: 1px solid var(--line); }
  .scenes .part .meta { padding: 0; min-width: 0; }
  .scenes .part.drop { box-shadow: 0 -3px 0 var(--paper); }
  .addscn { width: 100%; margin-top: 4px; border-style: dashed; }
  .center { padding: 20px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; }
  .player { position: relative; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line); width: min(100%, calc(56vh * 16 / 9)); margin: 0 auto; overflow: hidden; }
  .player.tall { aspect-ratio: 9/16; width: min(100%, calc(56vh * 9 / 16)); } .player.sq { aspect-ratio: 1; width: min(100%, 56vh); }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .badge { position: absolute; left: 10px; top: 10px; font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.2); padding: 5px 7px; z-index: 2; }
  .player .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font: 13px var(--mono); }
  .pbar { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
  .pbar .grow { flex: 1; }
  .track { display: flex; align-items: stretch; overflow-x: auto; padding: 6px 2px 12px; }
  .part { flex: none; width: 170px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; position: relative; }
  .part:hover { border-color: var(--rule); } .part.sel { border-color: var(--paper); box-shadow: 0 0 0 1px var(--paper); }
  .part.dragging { opacity: .4; } .part.drop { box-shadow: -3px 0 0 var(--paper); }
  .part .th { aspect-ratio: 16/9; background: #000 center/cover no-repeat; position: relative; overflow: hidden; }
  .part .th video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .part .meta { padding: 7px 9px 9px; }
  .part .nm { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .part .tx { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .part .sec { position: absolute; right: 6px; top: 6px; font: 500 11px/1 var(--mono); background: rgba(0,0,0,.72); padding: 4px 5px; }
  .part .n { position: absolute; left: 6px; top: 6px; font: 400 13px/1 var(--pixel); background: rgba(0,0,0,.72); padding: 3px 5px; }
  .join { flex: none; width: 52px; display: grid; place-items: center; position: relative; }
  .join button { width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--ground); display: grid; place-items: center; padding: 0; }
  .join button:hover { border-color: var(--paper); }
  .join small { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font: 10px/1.1 var(--mono); color: var(--muted); }
  .addp { flex: none; width: 40px; display: grid; place-items: center; }
  .addp button { width: 30px; height: 100%; min-height: 120px; border: 1px dashed var(--rule); background: none; display: grid; place-items: center; }
  .addp button:hover { border-color: var(--paper); }
  .insp { border-left: 1px solid var(--line); padding: 18px 20px 60px; overflow-y: auto; max-height: calc(100vh - 97px); position: sticky; top: 97px; }
  .insp h2 { margin: 6px 0 0; font: 400 26px/1.1 var(--serif); }
  .insp .sum { margin-top: 6px; }
  .tabs { display: flex; margin: 16px 0 14px; border: 1px solid var(--rule); }
  .tabs button { flex: 1; background: none; border: 0; padding: 8px 3px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tabs button + button { border-left: 1px solid var(--rule); }
  .tabs button.on { background: var(--paper); color: #000; }
  .pane { display: grid; gap: 14px; }
  .fld { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .fld i { font-style: normal; color: var(--faint); }
  .fld input, .fld textarea, .fld select { background: var(--surface); border: 1px solid var(--rule); padding: 9px 10px; font-size: 14px; color: var(--figure); width: 100%; }
  .fld textarea { resize: vertical; min-height: 64px; } .fld textarea.code { font: 13px/1.5 var(--mono); }
  .fld input:focus, .fld textarea:focus, .fld select:focus { outline: 0; border-color: var(--paper); }
  .pick img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top; border: 1px solid var(--rule); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border: 1px solid var(--line); background: none; padding: 0; text-align: left; }
  .tile:hover { border-color: var(--rule); } .tile.on { border-color: var(--paper); box-shadow: 0 0 0 1px var(--paper); }
  .ph { aspect-ratio: 16/9; background: #000 center/cover no-repeat; position: relative; overflow: hidden; }
  .ph video, .ph iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .ph .bars { position: absolute; inset: 0; display: flex; } .ph .bars i { flex: 1; }
  .tile .lb { padding: 7px 8px 8px; font-size: 12.5px; }
  .tile .lb small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; margin-top: 2px; }
  .slider { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .slider div { display: flex; justify-content: space-between; gap: 10px; } .slider em { font-style: normal; color: var(--figure); font-family: var(--mono); }
  .slider input { accent-color: var(--paper); width: 100%; }
  .seg { display: flex; flex-wrap: wrap; } .seg .btn { flex: 1; } .seg .btn + .btn { border-left: 0; }
  .partacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }

  /* sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 50; display: none; }
  .scrim.on { display: block; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--ground); border-left: 1px solid var(--paper); z-index: 51; overflow-y: auto; padding: 0 24px 40px; transform: translateX(102%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
  .sheet.on { transform: none; }
  .sheet header { position: sticky; top: 0; background: var(--ground); padding: 20px 0 14px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; z-index: 2; }
  .sheet header h2 { margin: 4px 0 0; font: 400 28px/1.1 var(--serif); }
  .sheet .grp { margin-top: 22px; }
  .sheet .grp h3 { margin: 0 0 10px; }
  .sheet .tiles { grid-template-columns: repeat(3, 1fr); }
  .pals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pal { display: flex; align-items: center; gap: 4px; padding: 8px; border: 1px solid var(--line); background: none; width: 100%; text-align: left; }
  .pal:hover { border-color: var(--rule); } .pal.on { border-color: var(--paper); }
  .pal i { width: 20px; height: 20px; display: block; border: 1px solid rgba(255,255,255,.15); }
  .pal span { margin-left: 8px; font-size: 13px; }
  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .colors label { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .colors input { width: 100%; height: 38px; padding: 0; border: 1px solid var(--rule); background: none; }
  .fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .font { padding: 10px 12px; border: 1px solid var(--line); background: none; text-align: left; font-size: 14px; }
  .font:hover { border-color: var(--rule); } .font.on { border-color: var(--paper); }
  .ask { position: fixed; right: 18px; bottom: 18px; z-index: 40; width: 380px; max-height: min(640px, 76vh); background: var(--surface); border: 1px solid var(--rule); display: none; flex-direction: column; }
  .ask.on { display: flex; }
  .ask .hd { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); }
  .ask .th { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 80px; }
  .ask .cmp { padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .ask textarea { width: 100%; min-height: 70px; background: var(--ground); border: 1px solid var(--rule); padding: 8px; resize: vertical; }
  .msg { max-width: 90%; padding: 8px 10px; border: 1px solid var(--line); background: var(--ground); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { align-self: flex-end; border-color: var(--rule); } .msg.agent { align-self: flex-start; border-left: 2px solid var(--paper); }
  .msg .st { font: 500 10.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: 6px; } .msg .st.read { color: var(--ok); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--paper); color: #000; padding: 9px 14px; font-size: 13px; transition: .2s; z-index: 80; pointer-events: none; max-width: 80vw; }
  #toast.on { opacity: 1; transform: translateX(-50%); }

  /* 3 · export */
  .exp { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; display: grid; gap: 22px; }
  .exp h1 { font: 400 42px/1.05 var(--serif); margin: 0; }
  .file { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); }
  .exp video { width: 100%; background: #000; border: 1px solid var(--line); }
  .list { max-width: 760px; margin: 0 auto; padding: 40px 20px; }
  .list h1 { font: 400 42px/1 var(--serif); margin: 0 0 20px; }
  .lrow { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  @media (max-width: 900px) { .editor { grid-template-columns: 1fr; } .insp { position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); } .ttl { display: none; } .sheet .tiles { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="park" hidden></div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog"></aside>
<div class="ask" id="ask" role="dialog" aria-label="Ask your agent"><div class="hd"><b>Ask your agent</b><button class="btn sm" data-ask-close>Close</button></div>
  <div class="th" id="thread"></div>
  <div class="cmp"><p class="hint">For anything the controls can't do: "make it more playful", "add our pricing", "use the photo of the team".</p>
  <textarea id="askText" aria-label="What to ask"></textarea><button class="btn primary" data-ask-send>Send</button></div></div>
<div id="toast" role="status"></div>
<script>
// ─── state, helpers ────────────────────────────────────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
let piece = params.get('p'), P = null, raw = '', view = null, sel = null, tab = 'text', misses = 0, playing = null;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);
const I = {
  undo: '<path d="M7 5 3 9l4 4M3 9h9a5 5 0 0 1 0 10H9"/>', style: '<circle cx="10" cy="10" r="7"/><path d="M10 3v14M3 10h7"/>', ask: '<path d="M3 4h14v10H8l-4 3v-3H3z"/>',
  add: '<path d="M10 4v12M4 10h12"/>', join: '<path d="M3 10h14M12 5l5 5-5 5"/>', back: '<path d="M12 4 6 10l6 6"/>', play: '<path d="M6 4l10 6-10 6z"/>', out: '<path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8"/>',
};
const icon = (n) => `<svg class="ico" viewBox="0 0 20 20">${I[n]}</svg>`;
let tt; const toast = (t, ms = 1900) => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), ms); };
const STEP = { brief: 'what', inventory: 'what', look: 'look', video: 'video', final: 'export' };
const ORDER = ['what', 'look', 'video', 'export'];
const tile = (o, attr, on) => `<button class="tile${on ? ' on' : ''}" ${attr} ${o.clip ? `data-clip="${esc(o.clip)}"` : ''}><div class="ph" ${o.poster ? `style="background-image:url('${esc(o.poster)}')"` : ''}></div><div class="lb">${esc(o.title)}${o.summary ? `<small>${esc(o.summary)}</small>` : ''}</div></button>`;
const swatch = (b) => `<div class="ph" data-swatch="${esc(JSON.stringify(b.entry ?? {}))}"><div class="bars">${(b.colors?.length ? b.colors : ['#111', '#333']).map((c) => `<i style="background:${esc(c)}"></i>`).join('')}</div></div>`;

async function load() {
  if (!piece) {
    const list = await (await fetch('/api/pieces')).json();
    if (list.length === 1) { piece = list[0].piece; history.replaceState(null, '', `?p=${encodeURIComponent(piece)}`); }
    else return renderList(list);
  }
  const res = await fetch(`/api/piece?p=${encodeURIComponent(piece)}`);
  if (!res.ok) { $('app').innerHTML = `<div class="empty">There is no piece “${esc(piece)}” in this project.</div>`; return; }
  const text = await res.text();
  if (text === raw) return;
  // a scene's still arriving changes only its thumbnail: no redraw, so the player never reloads under the user
  const noStills = (t) => t.replace(/"still":(?:"[^"]*"|null),?/g, '');
  if (raw && P && noStills(text) === noStills(raw)) { raw = text; P = JSON.parse(text); paintStills(); return; }
  raw = text; P = JSON.parse(text);
  if (!view) view = STEP[P.stage] ?? 'what';
  render();
}
async function act(body, quiet) {
  const res = await fetch(`/api/piece?p=${encodeURIComponent(piece)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const r = await res.json();
  if (r.error) toast(`Not done: ${r.error}`, 3200); else if (!quiet) toast(r.say ?? 'Saved');
  raw = ''; await load();
  return r;
}
function renderList(list) {
  $('app').innerHTML = `<header class="top"><div class="ttl">paper-motion studio</div></header><div class="list"><h1>Pieces</h1>
    ${list.length ? list.map((x) => `<a class="lrow" href="?p=${encodeURIComponent(x.piece)}"><b>${esc(x.title)}</b><span class="muted mono">pieces/${esc(x.piece)}</span></a>`).join('') : '<p class="muted">No pieces yet. Ask your agent for a video.</p>'}</div>`;
}

// ─── the frame: steps, whose turn it is ───────────────────────────────────────────────────────────────────────────
function turn() {
  if (misses >= 3) return ['off', 'The studio stopped', 'Ask your agent to start it again.'];
  if (P.building) return ['agent', 'Building your video', 'From what you kept. A few seconds.'];
  if (P.rendering) return ['agent', 'Rendering the final', P.rendering.joining ? 'Joining the parts' : P.rendering.part ? `Part ${P.rendering.part} of ${P.rendering.of}` : 'Starting'];
  // only what the studio can check: a question open, a command waiting on the piece, or what the agent said it is doing
  const A = P.agent ?? {};
  if (A.state === 'ask' && P.ask) return ['asking', 'Your agent asks', P.ask.text];
  if (A.state === 'listen') return ['listen', 'Your agent is listening.', 'What you do here reaches it.'];
  if (A.state === 'work') return ['agent', 'Your agent is working', `${A.working?.on ? `on ${A.working.on} · ` : ''}for ${since(A.working?.at)}`];
  if (P.stages.final?.status === 'approved' && P.stage === 'final') return ['done', 'Finished', 'Your files are in Export.'];
  return ['off', 'Your agent isn’t connected.', 'What you send is kept, and it reads it when it’s back.'];
}
// how long ago, in plain words
function since(at) { const s = Math.max(0, Math.round((Date.now() - Date.parse(at)) / 1000)); return s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`; }
const hhmm = (at) => new Date(at).toTimeString().slice(0, 5);
const notesKey = () => `pm:notes:${piece}`;
function seenNotes() { try { return sessionStorage.getItem(notesKey()) ?? ''; } catch { return ''; } }
function markNotes() { const last = (P?.thread ?? []).filter((m) => m.who === 'agent').at(-1)?.at; if (last) try { sessionStorage.setItem(notesKey(), last); } catch { /* storage blocked */ } }
// Ask your agent, as a thread: what the user sent (Sent, then Read with the time) and the agent's replies
function paintThread() {
  const th = $('thread'); if (!th || !P) return;
  const T = P.thread ?? [], off = P.agent?.state !== 'listen';
  th.innerHTML = T.length ? T.map((m) => `<div class="msg ${m.who}"><div>${esc(m.text)}</div><div class="st ${m.read ? 'read' : ''}">${m.who === 'agent' ? `Your agent · ${hhmm(m.at)}` : m.read ? `Read ${hhmm(m.read)}` : off ? 'Sent · your agent reads it when it’s back' : 'Sent'}</div></div>`).join('')
    : '<p class="hint">Nothing yet. What you send here reaches your agent, and you see when it has read it.</p>';
  th.scrollTop = th.scrollHeight;
  if ($('ask').classList.contains('on')) markNotes();
}
setInterval(() => { const el = $('since'); if (el && P?.agent?.working) el.textContent = `${P.agent.working.on ? `on ${P.agent.working.on} · ` : ''}for ${since(P.agent.working.at)}`; }, 10000);
function frame(body) {
  const [k, head, tx] = turn(), step = STEP[P.stage], A = P.agent ?? {};
  const done = (s) => ({ what: P.stages.inventory?.status === 'approved', look: P.stages.look?.status === 'approved' && P.stages.inventory?.status === 'approved', video: P.stages.video?.status === 'approved', export: P.stages.final?.status === 'approved' }[s]);
  const reached = Math.max(ORDER.indexOf(step), P.video ? 2 : 0, P.stages.video?.status === 'approved' || P.media?.final ? 3 : 0);
  document.title = `${k === 'asking' ? '● ' : ''}${P.title} · studio`;
  const unreadNotes = (P.thread ?? []).filter((m) => m.who === 'agent' && m.at > seenNotes()).length;
  return `<header class="top"><a class="back" href="/">${icon('back')}Pieces</a><div class="ttl">${esc(P.title)}</div>
    <nav class="steps" aria-label="Steps">${[['what', 'What you want to say'], ['look', 'How it looks'], ['video', 'Your video'], ['export', 'Export']].map(([id, t], i) => `<button class="${view === id ? 'on' : ''}" data-view="${id}" ${i > reached && !waitingOn(id) ? 'disabled' : ''}><b>${i + 1}</b>${t}${done(id) ? '<i title="done"></i>' : ''}${waitingOn(id) ? '<em class="sdot" title="Your agent suggests something here"></em>' : ''}</button>`).join('')}</nav>
    <button class="btn" data-undo ${P.undo ? `title="Undo ${esc(P.undo)}"` : 'disabled'}>${icon('undo')}Undo</button>
    <button class="btn" data-ask>${icon('ask')}Ask your agent${unreadNotes ? `<span class="nbadge">${unreadNotes}</span>` : ''}</button></header>
    <div class="turn ${k}"><i class="mk"></i>${k === 'asking'
      ? `<span class="lbl">${esc(head)}</span><span class="q">${esc(tx)}</span><span class="ans"><input id="ansText" placeholder="Your answer" aria-label="Your answer"><button class="btn primary sm" data-ans-send>Answer</button><button class="btn sm" data-ans-chat>Answered in the chat</button></span>`
      : `<span><b>${esc(head)}</b> <span class="tx" ${k === 'agent' && A.working ? 'id="since"' : ''}>${esc(tx)}</span></span><span class="grow"></span>
      ${A.focus && k === 'off' ? `<button class="btn sm" data-focus>Go to ${esc(A.app)} ${icon('out')}</button>` : ''}`}</div>
    <main>${body}</main>`;
}

// ─── 1 · what it says ─────────────────────────────────────────────────────────────────────────────────────────────
const BRIEF = [['what', 'What'], ['who', 'For whom'], ['format', 'Format'], ['tone', 'Tone'], ['action', 'At the end']];
function whatHTML() {
  const inv = P.inventory ?? { items: [] }, items = inv.items.filter((i) => i.status !== 'removed' || true);
  const wait = items.filter((i) => i.status === 'proposed').length, kept = items.filter((i) => i.status === 'kept').length;
  const briefOpen = P.stage === 'brief' || P.stages.brief?.status !== 'approved';
  // what can be corrected right in the row: a sentence, a command, a number and what it counts
  const EDITS = { line: ['text'], command: ['command'], figure: ['value', 'label'], share: ['value', 'label'], change: ['from', 'to', 'label'], screen: ['caption'] };
  const inline = (i) => (EDITS[i.kind] ?? []).map((k) => i.fields?.find((f) => f[0] === k)).filter(Boolean);
  const sentence = (i) => inline(i).length > 0;
  const rows = items.map((i) => `<div class="fact${i.status === 'removed' ? ' out' : ''}">
    ${i.thumb ? `<img src="${esc(i.thumb)}" alt="">` : '<span></span>'}
    <div><div class="k">${esc(i.name)}${i.status === 'proposed' ? '<span class="new">To decide</span>' : ''}${i.must ? '<span class="new">Must appear</span>' : ''}</div>
      ${sentence(i) && i.status !== 'removed' ? `<div class="t">${inline(i).map(([k, v]) => `<span class="edit" contenteditable="plaintext-only" spellcheck="false" data-inv="${esc(i.id)}" data-key="${esc(k)}" data-placeholder="${esc(k)}">${esc(v)}</span>`).join(i.kind === 'change' ? ' → ' : ' ')}</div>` : `<div class="t">${esc(i.what)}</div>`}
      <div class="s">From ${esc(i.source || 'you')}${i.missing?.length ? ` · still needs ${esc(i.missing.join(', ').toLowerCase())}` : ''}</div></div>
    <div class="acts">${i.status === 'removed' ? `<button class="btn sm" data-inv-set="${esc(i.id)}" data-v="kept">Keep it</button>`
      : `${i.status === 'proposed' ? `<button class="btn sm primary" data-inv-set="${esc(i.id)}" data-v="kept">Keep</button>` : `${P.video && !inVideo(i) ? `<button class="btn sm primary" data-addto="${esc(i.group ?? '')}">Add it to the video</button>` : ''}<button class="btn sm${i.must ? ' on' : ''}" data-inv-must="${esc(i.id)}" data-v="${i.must ? '' : '1'}">★ ${i.must ? 'Must appear' : 'Must?'}</button>`}<button class="btn sm" data-inv-set="${esc(i.id)}" data-v="removed">Not this</button>`}</div></div>`).join('');
  const atInv = ['brief', 'inventory'].includes(P.stage), hasVideo = !!P.video;
  return `<div class="what">
    <h1>What your video says</h1>
    <p class="sub">Your agent read what you already have and found these. Keep what is true, star what must appear, click a sentence to change it. How it looks is the next step.</p>
    <details class="brief"${briefOpen ? ' open' : ''}><summary><span><span class="lbl">The brief</span>&nbsp;&nbsp;${esc(P.brief.what)}</span><span class="muted">${P.stages.brief?.status === 'approved' ? 'approved' : 'to check'}</span></summary>
      <div class="rows">${BRIEF.map(([k, l]) => `<div class="row"><span class="muted">${l}</span><div class="edit" contenteditable="plaintext-only" spellcheck="false" data-brief="${k}" data-placeholder="Empty">${esc(P.brief[k])}</div></div>`).join('')}
      ${P.stage === 'brief' && P.stages.brief?.status === 'review' ? `<div><button class="btn primary sm" data-approve="brief">The brief is right</button></div>` : ''}</div></details>
    ${items.length ? rows : `<p class="muted">${P.stage === 'brief' ? 'Once the brief is right, your agent brings what your video could say.' : 'Your agent is looking for what your video could say.'}</p>`}
    ${inv.kinds && Object.keys(inv.kinds).length ? `<div class="addfact"><select id="addKind" aria-label="What is it">${Object.entries(inv.kinds).map(([id, k]) => `<option value="${id}">${esc(k.name)}</option>`).join('')}</select><input id="addText" placeholder="Add something true: a sentence, or a number and what it counts (163 pieces of motion)"><button class="btn" data-add-fact>Add</button></div>` : ''}
    <div class="nextbar"><span class="muted">${kept} thing${kept === 1 ? '' : 's'} in your video${wait ? ` · ${wait} still to decide` : ''}${inv.moments ? ` · a ${inv.seconds} s video holds about ${inv.moments} moments` : ''}</span>
      ${hasVideo ? `<button class="btn primary" data-view="video">Edit your video →</button>`
        : atInv && P.stages.inventory?.status === 'review' && (kept || wait) ? `<button class="btn primary" data-make>${wait ? 'Keep the rest. Next: how it looks →' : 'Next: how it looks →'}</button>`
        : P.building ? '<span class="muted">Building your video…</span>' : ''}</div></div>`;
}

// ─── 2 · how it looks ────────────────────────────────────────────────────────────────────────────────────────
// Every option is a still; pointing at one shows it in the single live preview, with the user's own sentence.
let lookShown = null, lookHover = null, lookTimer = 0;
const fontCss = new Set();
function loadFonts(urls) { for (const u of urls) if (u && !fontCss.has(u)) { fontCss.add(u); document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: u })); } }
async function showLook(patch) {
  const key = JSON.stringify(patch ?? {});
  if (key === lookShown || !$('lookPlayer')) return;
  lookShown = key;
  try {
    const r = await (await fetch(`/api/look?p=${encodeURIComponent(piece)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: key })).json();
    const box = $('lookPlayer'); if (!box || !r.url || lookShown !== key) return;
    let f = box.querySelector('iframe'); if (!f) { f = document.createElement('iframe'); f.title = 'How it looks'; box.append(f); }
    f.src = r.url; box.querySelector('.msg')?.remove();
  } catch { /* the preview is starting */ }
}
function hoverLook(patch) { clearTimeout(lookTimer); lookTimer = setTimeout(() => { lookHover = patch; showLook(patch); }, 160); }
// ─── the agent's suggestions: on the step and section they decide, first, marked as the agent's ─────────────────
const waitingOn = (stepId) => (P.choices ?? []).some((c) => c.status === 'waiting' && (c.where?.step === stepId || (stepId === 'video' && c.where?.step !== 'look')));
function choiceFace(o) {
  if (o.beats) return `<div class="beats">${o.beats.map((b) => `<span><b>${esc(b.name)}</b> ${esc(b.what)}</span>`).join('')}</div>`;
  if (o.items) return `<div class="kitf">${o.items.map((x) => x.colors ? `<i style="background:${x.colors.ground};border-bottom:5px solid ${x.colors.accent}"></i>` : x.display ? `<b style="font-family:'${esc(x.display)}'">Aa</b>` : x.poster ? `<img src="${esc(x.poster)}" alt="">` : '').join('')}</div>`;
  if (o.colors) return `<div class="sw" style="background:${o.colors.ground};color:${o.colors.figure}"><b style="font-family:var(--serif)">Aa</b><i style="background:${o.colors.accent}"></i></div>`;
  if (o.display) return `<div class="spec"><b style="font-family:'${esc(o.display)}'">Aa</b><span style="font-family:'${esc(o.text ?? o.display)}'">${esc(o.title)}</span></div>`;
  return o.poster ? `<img src="${esc(o.poster)}" alt="" loading="lazy">` : '';
}
const lkPatch = (o) => (o.colors ? { palette: o.id, colors: o.colors } : o.display ? { font: o.id } : o.type === 'background' ? { background: o.id } : null);
function sug(step, section) {
  const list = (P.choices ?? []).filter((c) => c.status === 'waiting' && (c.where?.step === step || (step === 'video' && c.where?.step !== 'look')) && (!section || c.where?.section === section));
  return list.map((c) => {
    for (const o of c.options) if (o.css) loadFonts(o.css); else for (const x of o.items ?? []) if (x.css) loadFonts(x.css);
    const cards = c.options.map((o) => { const lk = lkPatch(o);
      return `<button class="lkc" data-choose="${c.id}" data-label="${o.label}" ${lk ? `data-lk='${JSON.stringify(lk)}'` : ''} ${o.clip ? `data-clip="${esc(o.clip)}"` : ''}><span class="sugb">Suggested by your agent</span><div class="lkf ${o.clip ? 'ph' : ''}" ${o.clip ? `style="background-image:url('${esc(o.poster)}')"` : ''}>${o.clip ? '' : choiceFace(o)}</div><div class="lkn"><span><b>${o.label}</b> · ${esc(o.title)}</span></div>${o.note ? `<p class="chnote">${esc(o.note)}</p>` : ''}</button>`; }).join('');
    return `<div class="agentsug"><div class="agentnote"><b>Your agent suggests ${c.options.length === 2 ? 'two' : c.options.length === 3 ? 'three' : c.options.length === 4 ? 'four' : ''}.</b> ${esc(c.ask ?? c.title)}</div>
      <div class="lkg">${cards}</div>
      <div class="none"><input data-nonetext="${c.id}" placeholder="None of these? Say what you’d rather see" aria-label="What you would rather see"><button class="btn sm" data-none="${c.id}">None of these</button></div></div>`;
  }).join('');
}
function lookHTML() {
  const L = P.lookOptions; if (!L) return '<div class="empty">How it looks is loading…</div>';
  const C = L.current, card = (on, attrs, face, name, sub = '') => `<button class="lkc ${on ? 'on' : ''}" ${attrs}><div class="lkf">${face}</div><div class="lkn"><span>${esc(name)}</span>${sub ? `<span class="muted">${esc(sub)}</span>` : ''}</div></button>`;
  loadFonts(L.fonts.flatMap((f) => f.css));
  const swatch = (c) => `<div class="sw" style="background:${c.ground};color:${c.figure}"><b style="font-family:var(--serif)">Aa</b><i style="background:${c.accent}"></i></div>`;
  const pals = L.palettes.map((x) => card(C.palette === x.id, `data-lpal="${x.id}" data-lk='${JSON.stringify({ palette: x.id })}'`, swatch(x.colors), x.title)).join('');
  const fonts = L.fonts.map((f) => card(C.font === f.id, `data-lfont="${f.id}" data-lk='${JSON.stringify({ font: f.id })}'`, `<div class="spec"><b style="font-family:'${esc(f.display)}'">Aa</b><span style="font-family:'${esc(f.text ?? f.display)}'">${esc(L.headline.slice(0, 28))}</span></div>`, f.title)).join('');
  const bgFace = (b) => b.poster ? `<img src="${esc(b.poster)}" alt="" loading="lazy">` : `<div style="position:absolute;inset:0;background:linear-gradient(135deg, ${(b.colors.length ? b.colors : ['#222', '#555']).join(',')})"></div>`;
  const bgs = L.backgrounds.slice(0, 24).map((b) => card(C.background === b.id, `data-lbg="${b.id}" data-lk='${JSON.stringify({ background: b.id })}'`, `${bgFace(b)}${b.mine ? '<span class="yours">Yours</span>' : ''}`, b.title)).join('');
  const enters = L.entrances.map((e) => `<button class="lkc ${C.entrance === e.value ? 'on' : ''}" data-lenter="${e.value}" data-lk='${JSON.stringify({ entrance: e.value })}' ${e.clip ? `data-clip="${esc(e.clip)}"` : ''}><div class="lkf ph" style="background-image:url('${esc(e.poster ?? '')}')"></div><div class="lkn"><span>${esc(e.title)}</span></div></button>`).join('');
  return `<div class="look">
    <div class="lkpv"><div class="lbl" style="margin-bottom:8px">Your video, with your own sentence</div>
      <div class="lkbox" id="lookPlayer"><button class="lkagain" data-look-replay>↻ Play again</button>${L.live ? '' : '<div class="msg">The live preview is starting…</div>'}</div>
      <p class="hint" style="margin-top:10px">Point at any option to see it here; click it to choose. Your scenes follow.</p></div>
    <div class="lkopts" id="lookOpts">
      <h1>How it looks</h1>
      <p class="sub">${P.stages.look?.status === 'approved' ? 'Your brand already has a look, so this step is done. Change anything you like.' : 'Choose its colours, type, background and movement.'}</p>
      ${sug('look', 'kit')}
      <section><h2>Colours</h2>${sug('look', 'colours')}<div class="lkg">${pals}</div>
        <div class="lkcols">${['ground', 'figure', 'accent'].map((k) => `<label>${{ ground: 'Background', figure: 'Text', accent: 'Accent' }[k]} <input type="color" data-lcol="${k}" value="${esc(C.colors[k] ?? '#000000')}"></label>`).join('')}</div></section>
      <section><h2>Type</h2>${sug('look', 'type')}<div class="lkg">${fonts}</div></section>
      <section><h2>Background</h2>${sug('look', 'background')}<p class="hint">The stills are in the library’s colours: point at one to see it in yours.</p><div class="lkg">${bgs}</div></section>
      <section><h2>Movement</h2>${sug('look', 'movement')}<div class="seg">${L.paces.map((x) => `<button class="${C.pace === x ? 'on' : ''}" data-lpace="${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>
        <p class="hint" style="margin:14px 0 0">How words arrive</p><div class="lkg">${enters}</div></section>
    </div>
    <div class="nextbar"><span class="muted">${P.video ? 'Your scenes already use this look.' : 'Next, your video is built from what you kept, in this look.'}</span>
      ${P.building ? '<span class="muted">Building your video…</span>' : P.video ? '<button class="btn primary" data-view="video">Back to your video →</button>' : '<button class="btn primary" data-build>Next: make my video →</button>'}</div></div>`;
}

// ─── 3 · your video ───────────────────────────────────────────────────────────────────────────────────────────────
const cur = () => P.video?.parts.find((p) => p.dir === sel) ?? P.video?.parts[0];
const joinName = (id) => P.library?.joins.find((j) => j.id === id)?.title ?? id;
const firstWords = (p) => { const w = p.words.find((f) => f.kind === 'text' && f.value) ?? p.words.find((f) => f.value); return w ? String(w.value).split('\n')[0].replace(/\s*\|\s*/g, ' ') : p.summary; };
// is a kept item shown by some scene already (the video never rebuilds by itself: the user adds what is new)

function inspHTML(p) {

    if (f.kind === 'lines') return `<label class="fld">${esc(f.label)} <i>one per line</i><textarea ${a} rows="${Math.min(8, String(f.value).split('\n').length + 1)}">${esc(f.value)}</textarea></label>`;

    <div class="pane">${panes[tab]}</div>

// the player: the part's real scene, playing live; kept across redraws, reloaded only when the part changed

// ─── drawing ──────────────────────────────────────────────────────────────────────────────────────────────────────
function render() {
  if (!P) return;
  paintThread();   // the thread lives outside the page body, so it is painted even while a field has focus
  // a field being typed in is never redrawn under the cursor: the page catches up when it loses focus
  const a = document.activeElement;
  if (a && a.closest?.('#app') && (a.matches('input, textarea, select') || a.isContentEditable)) { pending = true; return; }
  pending = false;
  const body = view === 'what' ? whatHTML() : view === 'look' ? lookHTML() : view === 'video' ? videoHTML() : exportHTML();
  const keepPlayer = $('player')?.querySelector('iframe'), keepLook = $('lookPlayer')?.querySelector('iframe');
  // live previews survive a redraw: parked outside the page body and moved back without reloading (moveBefore keeps an
  // iframe alive where the browser has it; elsewhere it reloads, as before)
  const park = $('park'), keep = (f, into) => { if (!f || !into) return; if (into.moveBefore && f.isConnected) into.moveBefore(f, null); else into.append(f); };
  keep(keepPlayer, park); keep(keepLook, park);
  const scroll = { insp: $('insp')?.scrollTop ?? 0, track: $('track')?.scrollTop ?? 0 };
  $('app').innerHTML = frame(body);
  keep(keepPlayer, $('player')); keep(keepLook, $('lookPlayer'));
  for (const f of park.querySelectorAll('iframe')) f.remove();   // a preview whose step is gone
  if (view === 'look') showLook(lookHover);
  paintPlayer();
  if ($('insp')) $('insp').scrollTop = scroll.insp;
  if ($('track')) $('track').scrollTop = scroll.track;
  if (sheetOpen) paintSheet();
}
let pending = false;

// ─── sheets: add, show another way, transition, more backgrounds, style ──────────────────────────────────────────
let sheetOpen = null;
function openSheet(kind, arg) { sheetOpen = { kind, arg }; paintSheet(); $('sheet').classList.add('on'); $('scrim').classList.add('on'); }

let lastSheet = '';

  else if (s.kind === 'swap') { const p = cur(), mine = L.intents.find((g) => g.blocks.some((b) => b.id === p.id)); h = head(`Part ${P.video.parts.indexOf(p) + 1}`, 'Show it another way') + `<p class="hint" style="margin-top:14px">Same content, shown differently. Point at one to see it move.</p>` + [mine, ...L.intents.filter((g) => g !== mine)].filter(Boolean).map((g, i) => `<div class="grp"><h3 class="lbl">${i ? esc(g.title) : `${esc(g.title)} · like this part`}</h3><div class="tiles">${g.blocks.map((b) => tile(b, `data-swapto="${esc(b.id)}"`, b.id === p.id)).join('')}</div></div>`).join(''); }

// ─── wiring ───────────────────────────────────────────────────────────────────────────────────────────────────────
const vact = (type, extra = {}) => act({ type: `v-${type}`, part: sel, ...extra });
document.addEventListener('click', async (e) => {
  if (e.target.id === 'scrim') return closeSheet();
  const b = e.target.closest('button, .part'); if (!b || b.disabled) return; const d = b.dataset;
  if (d.view) { view = d.view; closeSheet(); render(); scrollTo({ top: 0 }); }
  else if ('close' in d) closeSheet();
  else if (d.part !== undefined && !e.target.closest('button')) { sel = d.part; render(); }
  else if (d.tab) { tab = d.tab; render(); }
  else if ('undo' in d) act({ type: 'undo' });

  else if ('ansChat' in d) { await act({ type: 'ask-close' }, true); toast('Closed'); }
  else if ('focus' in d) fetch(`/api/focus?p=${encodeURIComponent(piece)}`, { method: 'POST' });
  else if (d.approve) { await act({ type: 'approve', stage: d.approve }); if (d.approve === 'video') { view = 'export'; render(); } }
  else if ('make' in d) { if (P.inventory.items.some((i) => i.status === 'proposed')) await act({ type: 'inv-rest', value: 'kept' }, true); await act({ type: 'approve', stage: 'inventory' }, true); view = 'look'; lookShown = null; render(); scrollTo({ top: 0 }); }
  else if ('build' in d) { await act({ type: 'approve', stage: 'look' }, true); view = 'video'; if (!P.video) toast('Building your video…', 3000); render(); scrollTo({ top: 0 }); }
  else if (d.lpal) { await act({ type: 'style-palette', value: d.lpal }); lookShown = null; showLook(null); }
  else if (d.lfont) { await act({ type: 'style-font', value: d.lfont }); lookShown = null; showLook(null); }
  else if (d.lbg) { await act({ type: 'style-background', value: d.lbg }); lookShown = null; showLook(null); }
  else if (d.lenter) { await act({ type: 'style-entrance', value: d.lenter }); lookShown = null; showLook(null); }
  else if (d.lpace) { await act({ type: 'style-pace', value: d.lpace }); lookShown = null; showLook(null); }
  else if ('lookReplay' in d) { lookShown = null; showLook(lookHover); }
  else if (d.choose) { const r = await act({ type: 'choose', choice: d.choose, label: d.label }, true); if (!r?.error) toast(`${P.agent?.listening ? 'Sent to your agent' : 'Kept for your agent'}: ${d.label}`, 2800); lookShown = null; if (view === 'look') showLook(null); }
  else if (d.none) { const t = document.querySelector(`[data-nonetext="${d.none}"]`)?.value.trim() ?? ''; await act({ type: 'choose', choice: d.none, none: true, text: t }, true); toast('Your agent will look for others', 2800); }
  else if (d.invSet) act({ type: 'inv-status', id: d.invSet, value: d.v }, true);
  else if (d.invMust) act({ type: 'inv-must', id: d.invMust, value: !!d.v }, true);
  else if ('addFact' in d) { const k = $('addKind').value, t = $('addText').value.trim(); if (!t) return toast('Write it first'); const m = t.match(/^([\d.,]+%?)\s+(.+)$/); const fields = k === 'line' ? { text: t } : k === 'figure' && m ? { value: m[1], label: m[2] } : k === 'share' && m ? { value: m[1].replace('%', ''), label: m[2] } : { text: t, label: t }; const r = await act({ type: 'inv-add', kind: k, fields }, true); if (!r.error) { $('addText').value = ''; toast('Added'); } }
  else if (d.addat !== undefined) openSheet('add', Number(d.addat));
  else if (d.addblock) { closeSheet(); const r = await act({ type: 'v-add', at: sheetOpenAt, block: d.addblock }); if (r.part) { sel = r.part; tab = 'text'; render(); } }
  else if ('swap' in d) openSheet('swap');
  else if (d.swapto) { closeSheet(); const r = await vact('swap', { block: d.swapto }); if (r.part) { sel = r.part; render(); } }
  else if ('dup' in d) { const r = await vact('duplicate'); if (r.part) { sel = r.part; render(); } }
  else if ('remove' in d) { const i = P.video.parts.findIndex((x) => x.dir === sel); const r = await vact('remove'); if (!r.error) { sel = P.video.parts[Math.max(0, i - 1)]?.dir; render(); toast('Removed. Undo brings it back.'); } }
  else if (d.joinof) openSheet('join', d.joinof);
  else if (d.addto !== undefined) { view = 'video'; render(); scrollTo({ top: 0 }); openSheet('add', P.video.parts.length); }
  else if (d.joinp) act({ type: 'v-join', part: sel, value: d.joinp });
  else if ('joinallp' in d) { const p = cur(); act({ type: 'v-join', part: p.dir, value: p.join, all: true }); }
  else if (d.setjoin) { const at = sheetOpen.arg; closeSheet(); act({ type: 'v-join', part: at, value: d.setjoin }); }
  else if ('joinall' in d) { const p = P.video.parts.find((x) => x.dir === sheetOpen.arg); closeSheet(); act({ type: 'v-join', part: p.dir, value: p.join, all: true }); }
  else if (d.motion) vact('motion', { value: d.motion });
  else if (d.bg !== undefined) vact('background', { value: d.bg });
  else if ('bgall' in d) vact('background', { value: cur().background ?? '', all: true });
  else if ('bgmore' in d) openSheet('bgmore');
  else if (d.bgadd) { b.querySelector('.lb').textContent = 'Adding…'; const r = await (await fetch(`/api/background?p=${encodeURIComponent(piece)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: d.bgadd }) })).json(); if (r.error) return toast(`Not added: ${r.error}`); closeSheet(); vact('background', { value: d.bgadd }); }
  else if (d.tunev) vact('tune', { key: d.tunev, value: d.v });
  else if (d.palette) act({ type: 'style-palette', value: d.palette });
  else if (d.fontpair) act({ type: 'style-font', value: d.fontpair });
  else if (d.pace) act({ type: 'style-pace', value: d.pace });

let sheetOpenAt = 0;
const _open = openSheet; openSheet = (k, a) => { if (k === 'add') sheetOpenAt = a; _open(k, a); };
function playAll() {
  if (playing) { clearTimeout(playing); playing = null; onEnded = null; render(); return; }

  // each part plays once in the player; the next one starts when it says it ended (or after its length, if it never does)
  const next = () => {
    clearTimeout(playing);
    if (i >= parts.length || view !== 'video') { playing = null; onEnded = null; render(); return; }

  };
  playing = 1; next();
}
let onEnded = null;
addEventListener('message', (e) => { if (e.data?.pm === 'ended' && onEnded && e.source === $('player')?.querySelector('iframe')?.contentWindow) onEnded(); });
document.addEventListener('change', async (e) => {
  if (e.target.dataset?.lcol) { await act({ type: 'style-color', key: e.target.dataset.lcol, value: e.target.value }); lookShown = null; showLook(null); return; }
  const d = e.target.dataset;
  if (d.word !== undefined) vact('word', { key: d.word, value: e.target.value });
  else if (d.tune) vact('tune', { key: d.tune, value: e.target.value });
  else if ('seconds' in d) vact('seconds', { value: e.target.value });
  else if (d.color) act({ type: 'style-color', key: d.color, value: e.target.value });
});
document.addEventListener('input', (e) => {
  const d = e.target.dataset; const k = d.tune ?? ('seconds' in d ? 'seconds' : null); if (!k) return;
  const o = $(`tv-${k}`); if (o) o.textContent = k === 'seconds' ? `${Number(e.target.value).toFixed(1)} s` : e.target.value;
  if (k === 'seconds' && $('tv-pace')) $('tv-pace').textContent = pace(Number(e.target.value), Number(d.natural));
});
// a part always plays its whole scene: its length is a speed
function pace(s, natural) {

}
document.addEventListener('focusout', (e) => {
  const d = e.target.dataset ?? {}, v = e.target.isContentEditable ? e.target.innerText.trim() : null;
  if (d.brief && v !== P.brief[d.brief]) act({ type: 'brief', key: d.brief, value: v }, true);
  else if (d.inv && v) { const it = P.inventory.items.find((i) => i.id === d.inv); if (v !== String(it?.fields?.find((f) => f[0] === d.key)?.[1] ?? '')) act({ type: 'inv-field', id: d.inv, key: d.key, value: v }); }
  setTimeout(() => { if (pending) render(); }, 0);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSheet(); $('ask').classList.remove('on'); }
  if (e.key === 'Enter' && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.target.closest('input, textarea, [contenteditable]') && P?.undo) { e.preventDefault(); act({ type: 'undo' }); }
});
// samples play while the pointer is on them: a block's clip, or a background's shader running live
document.addEventListener('mouseover', (e) => {
  if (view === 'look') { const k = e.target.closest?.('[data-lk]'); if (k) hoverLook(JSON.parse(k.dataset.lk)); else if (lookHover && !e.target.closest?.('#lookPlayer')) hoverLook(null); }
});
document.addEventListener('mouseover', (e) => {
  const c = e.target.closest?.('[data-clip]'); const ph = c?.querySelector('.ph, .th');
  if (ph && c.dataset.clip && !ph.querySelector('video')) { const v = document.createElement('video'); Object.assign(v, { src: c.dataset.clip, muted: true, loop: true, autoplay: true, playsInline: true }); ph.append(v); }
  const sw = e.target.closest?.('[data-swatch]');
  if (sw && !sw.querySelector('iframe') && P?.inventory?.live && sw.dataset.swatch !== '{}') { const f = document.createElement('iframe'); f.src = `${P.inventory.live}/__pm/runtime/swatch.html#${encodeURIComponent(sw.dataset.swatch)}`; f.title = 'Live background'; sw.append(f); }
});
document.addEventListener('mouseout', (e) => { for (const s of ['[data-clip]', '[data-swatch]']) { const c = e.target.closest?.(s); if (c && !c.contains(e.relatedTarget)) c.querySelector('.ph > video, .th > video, iframe')?.remove(); } });
// drag a part to reorder
let from = null;
document.addEventListener('dragstart', (e) => { const p = e.target.closest?.('.part'); if (!p) return; from = p.dataset.part; p.classList.add('dragging'); });
document.addEventListener('dragover', (e) => { const p = e.target.closest?.('.part'); if (from === null || !p) return; e.preventDefault(); document.querySelectorAll('.part.drop').forEach((x) => x.classList.remove('drop')); p.classList.add('drop'); });
document.addEventListener('drop', (e) => {
  const p = e.target.closest?.('.part'); if (from === null || !p) return; e.preventDefault();

document.addEventListener('dragend', () => { from = null; document.querySelectorAll('.dragging, .drop').forEach((x) => x.classList.remove('dragging', 'drop')); });
// the page keeps up with the studio; a few misses in a row mean the studio itself stopped
setInterval(() => load().then(() => { misses = 0; }).catch(() => { if (++misses === 3) render(); }), 1500);
load();
</script>
