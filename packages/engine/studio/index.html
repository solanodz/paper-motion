<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-motion studio</title>
<!-- pamo studio: a piece, stage by stage. Reads /api/piece, writes actions back; the agent reads them from piece.json. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://paper-motion.vercel.app/fonts/geist-serif.css" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --panel: #111111; --panel2: #161616; --line: #ffffff14; --line2: #ffffff24;
    --fg: #ece9e2; --dim: #8e8b85; --faint: #5a5853; --paper: #e9e4d8; --warn: #ff4d2e; --ok: #3ddc84;
    --serif: 'Geist Serif', Georgia, serif; --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  video, img { display: block; width: 100%; background: #000; }
  a { color: inherit; }
  .mono { font-family: var(--mono); } .serif { font-family: var(--serif); font-weight: 400; }
  .dim { color: var(--dim); } .faint { color: var(--faint); }
  .btn { border: 1px solid var(--line2); background: transparent; border-radius: 999px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { background: #ffffff0a; }
  .btn.primary { background: var(--paper); color: #111; border-color: var(--paper); }
  .btn.primary:hover { background: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn[disabled] { opacity: .35; cursor: default; }
  textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 64px; }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--paper); }
  select, input[type=number] { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; }
  .chip { font: 12px var(--mono); border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px; color: var(--dim); white-space: nowrap; }
  .sw { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line2); }
  .spin { animation: spin 1s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the loader: diagonal stripes that slide forever without a seam. At 110deg, stripes 24px apart repeat every
     24 / sin(70deg) ≈ 25.54px across, so the layer moves exactly that far per loop (and starts one period to the left) */
  .rendering { position: relative; overflow: hidden; }
  .rendering::after { content: ''; position: absolute; top: 0; bottom: 0; left: -25.54px; right: 0; background: repeating-linear-gradient(110deg, #0000 0 12px, #ffffff08 12px 24px); animation: slide 0.6s linear infinite; will-change: transform; pointer-events: none; }
  @keyframes slide { to { transform: translateX(25.54px); } }
  @media (prefers-reduced-motion: reduce) { .rendering::after { animation: none; } }
  .empty { aspect-ratio: 16/9; display: grid; place-items: center; background: #0d0d0d; color: var(--faint); font: 12px var(--mono); }
  .info { position: relative; display: inline-grid; place-items: center; color: var(--faint); cursor: help; border-radius: 50%; }
  .info:hover, .info:focus { color: var(--fg); outline: none; }
  .info .tip { position: absolute; left: -10px; top: calc(100% + 8px); width: 280px; z-index: 20; padding: 10px 12px; border-radius: 10px; background: #1d1d1d; border: 1px solid var(--line2); box-shadow: 0 10px 30px #000a; color: var(--fg); font: 13px/1.45 var(--sans); white-space: normal; opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .12s, transform .12s; }
  .info .tip::before { content: ''; position: absolute; left: 14px; top: -5px; width: 8px; height: 8px; background: #1d1d1d; border-left: 1px solid var(--line2); border-top: 1px solid var(--line2); transform: rotate(45deg); }
  .info:hover .tip, .info:focus .tip { opacity: 1; transform: none; }
  .edit { border-radius: 6px; padding: 4px 8px; margin: -4px -8px; outline: 1px solid transparent; cursor: text; min-height: 1.5em; }
  .edit:hover { outline-color: var(--line2); }
  .edit:focus { outline: 1px solid var(--paper); background: var(--panel2); color: var(--fg); }
  .edit:empty::before { content: attr(data-placeholder); color: var(--faint); }
  .txt { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; min-width: 0; }
  .txt:hover { border-color: var(--line2); } .txt:focus { background: var(--panel2); }
  .grip { cursor: grab; color: var(--faint); display: grid; place-items: center; align-self: stretch; border-radius: 6px; }
  .grip:hover { color: var(--fg); background: #ffffff0d; }
  .dragging { opacity: .35; }
  .drop-before { box-shadow: 0 -3px 0 0 var(--paper); } .drop-after { box-shadow: 0 3px 0 0 var(--paper); }
  [data-trackdrag].drop-before { box-shadow: -3px 0 0 0 var(--paper); } [data-trackdrag].drop-after { box-shadow: 3px 0 0 0 var(--paper); }
  body.resizing { cursor: col-resize; user-select: none; } body.resizing video { pointer-events: none; }
  /* layout: rail · stage · decision, then the decision moves above the stage, then the rail becomes a strip */
  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr) var(--rw, 340px); grid-template-areas: 'rail stage decide'; min-height: 100vh; }
  .rail { grid-area: rail; border-right: 1px solid var(--line); padding: 22px 12px; display: grid; align-content: start; gap: 4px; }
  .rail .head { padding: 0 14px 18px; }
  .steps { display: grid; gap: 4px; }
  .step { all: unset; cursor: pointer; display: grid; grid-template-columns: 28px 1fr 18px; gap: 10px; align-items: start; padding: 12px 14px; border-radius: 10px; }
  .step.on { background: var(--panel2); }
  .step:disabled { cursor: default; opacity: .45; }
  .step:focus-visible { outline: 1px solid var(--paper); }
  .stage { grid-area: stage; padding: 28px 36px 90px; display: grid; align-content: start; gap: 22px; max-width: 1000px; min-width: 0; }
  .stage h1 { font-size: 40px; margin: 4px 0 2px; line-height: 1.05; }
  .decide { grid-area: decide; border-left: 1px solid var(--line); padding: 28px 22px; display: grid; align-content: start; gap: 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brow { display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: start; }
  .blabel { font-size: 12px; padding-top: 9px; display: flex; gap: 6px; align-items: center; }
  .card { display: grid; grid-template-columns: 18px minmax(180px, 260px) minmax(0, 1fr); gap: 14px; padding: 14px 14px 14px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .track { display: flex; align-items: stretch; margin-top: 14px; }
  .tblock { cursor: grab; min-width: 0; }
  @media (max-width: 1180px) {
    .shell { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: 'rail decide' 'rail stage'; grid-template-rows: auto 1fr; }
    .decide { position: static; height: auto; border-left: 0; border-bottom: 1px solid var(--line); padding: 20px 36px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 12px 24px; }
    .decide > * { grid-column: 1 / -1; }
    .decide > .btn.primary { grid-column: 1; align-self: start; }
    .decide > div:has(> #note) { grid-column: 2; grid-row: span 2; }
    #resize { display: none; }
    .decide .activity { display: none !important; }
    .decide .notes > div:nth-last-child(n+3) { display: none; }
    .decide .notes > div:first-child { display: block; }
  }
  @media (max-width: 760px) {
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'rail' 'decide' 'stage'; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 0 10px; position: sticky; top: 0; z-index: 10; background: var(--bg); gap: 10px; }
    .rail .head { padding: 0 16px; }
    .rail .head .serif { font-size: 20px !important; margin-top: 6px !important; }
    .steps { display: flex; overflow-x: auto; gap: 4px; padding: 0 12px; scrollbar-width: none; }
    .steps::-webkit-scrollbar { display: none; }
    .step { grid-template-columns: auto auto auto; gap: 7px; padding: 7px 12px; flex: 0 0 auto; border-radius: 999px; align-items: center; }
    .step .sub, .step > .mono { display: none; }
    .stage { padding: 20px 16px 90px; gap: 18px; }
    .stage h1 { font-size: 32px; }
    .decide { padding: 16px; grid-template-columns: minmax(0, 1fr); }
    .decide > .btn.primary, .decide > div:has(> #note) { grid-column: 1; grid-row: auto; }
    .brow { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .blabel { padding-top: 0; }
    .card { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    .card .grip { display: none; }
    .track { overflow-x: auto; padding-bottom: 6px; }
    .tblock { min-width: 96px; }
    .info .tip { width: min(280px, calc(100vw - 48px)); }
  }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1d1d1d; border: 1px solid var(--line2); border-radius: 999px; padding: 8px 16px; font: 12px var(--mono); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="app"><div class="empty" style="height:100vh;aspect-ratio:auto">loading…</div></div>
<div id="toast"></div>
<script>
const STAGES = [
  ['brief', 'Brief', 'what we say, to whom and how'],
  ['look', 'Look', 'colors, type, background and moves'],
  ['structure', 'Structure', 'the beats, and the block that shows each'],
  ['parts', 'Parts', 'each block in your brand, one by one'],
  ['assembly', 'Assembly', 'everything joined, with its transitions'],
  ['final', 'Final', 'full quality and formats'],
];
const BRIEF_HELP = {
  what: ['what', 'One or two sentences: what the video shows and where it will live (your site, LinkedIn, a launch). Tell the story, not the style.'],
  who: ['for whom', 'Who watches it and what they already know. The more specific, the better the words on screen.'],
  format: ['format', 'Shape and length. 16:9 for web and YouTube, 9:16 for Reels and Stories, 1:1 for feeds. Most pieces run 15–30 s.'],
  tone: ['tone', 'How it should feel, in a few words (calm, bold, playful), and anything to avoid.'],
  action: ['call to action', 'The one thing viewers should do at the end: a URL, a button, a date.'],
};
const STATUS = { approved: ['approved', 'var(--ok)'], review: ['to review', 'var(--paper)'], changes: ['changes asked', 'var(--warn)'], rendering: ['rendering', 'var(--dim)'], queued: ['queued', 'var(--faint)'], working: ['your agent is on it', 'var(--dim)'], pending: ['later', 'var(--faint)'] };
const TINT = { approved: '#3ddc8424', changes: '#ff4d2e2b', review: '#e9e4d81f' };
const I = {
  ok: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  review: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-opacity=".35"/></svg>',
  pending: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-dasharray="2 2.4"/></svg>',
  changes: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 12.5 L3.6 9.8 L10.4 3 L13 5.6 L6.2 12.4 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  rendering: '<svg class="spin" width="14" height="14" viewBox="0 0 16 16"><path d="M8 2.5 A5.5 5.5 0 1 1 2.5 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  queued: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M4 8 H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.5 2.5"/></svg>',
  note: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M2.5 3.5 H13.5 V10.5 H7 L4 13 V10.5 H2.5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  info: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="5" r="0.95" fill="currentColor"/><path d="M8 7.3 V11.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  grip: '<svg width="10" height="16" viewBox="0 0 10 16">' + [3, 8, 13].map((y) => `<circle cx="2.5" cy="${y}" r="1.3" fill="currentColor"/><circle cx="7.5" cy="${y}" r="1.3" fill="currentColor"/>`).join('') + '</svg>',
  down: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 2.5 V10.5 M4.5 7 L8 10.5 L11.5 7 M3 13.5 H13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  join: {
    cut: '<svg width="18" height="14" viewBox="0 0 18 14"><path d="M9 1 V13" stroke="currentColor" stroke-width="1.4"/></svg>',
    whip: '<svg width="18" height="14" viewBox="0 0 18 14"><path d="M2 7 H15 M11 3 L15 7 L11 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2 4 H7 M2 10 H7" stroke="currentColor" stroke-opacity=".4"/></svg>',
    dissolve: '<svg width="18" height="14" viewBox="0 0 18 14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity=".5"/></svg>',
    dip: '<svg width="18" height="14" viewBox="0 0 18 14"><path d="M1 3 Q9 13 17 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  },
};
I.approved = I.ok; I.working = I.rendering;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const badge = (st) => { const [l, c] = STATUS[st] ?? [st, 'var(--dim)']; return `<span class="mono" style="display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:500;color:${c};${TINT[st] ? `background:${TINT[st]};padding:3px 10px 3px 8px;border-radius:999px` : ''}">${I[st] ?? ''}${l}</span>`; };
const vid = (src, extra = '') => `<video data-k="${esc(src)}" src="${esc(src)}" muted loop autoplay playsinline ${extra}></video>`;
const fmt = (s) => (s == null ? '' : `${Number(s).toFixed(1).replace('.0', '')} s`);
const clock = (iso) => (iso ? new Date(iso).toTimeString().slice(0, 5) : '');
const order = (k) => STAGES.findIndex(([x]) => x === k);

// ─── state ─────────────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
let piece = params.get('p'), P = null, raw = '', view = null, followed = null;
const RW = [280, 560];
let rightW = (() => { try { return Math.min(RW[1], Math.max(RW[0], Number(localStorage.getItem('studio:rw')) || 340)); } catch { return 340; } })();

async function load() {
  if (!piece) {
    const list = await (await fetch('/api/pieces')).json();
    if (list.length === 1) { piece = list[0].piece; history.replaceState(null, '', `?p=${encodeURIComponent(piece)}`); }
    else return renderList(list);
  }
  const res = await fetch(`/api/piece?p=${encodeURIComponent(piece)}`);
  if (!res.ok) { document.getElementById('app').innerHTML = `<div class="empty" style="height:100vh;aspect-ratio:auto">no piece “${esc(piece)}” here</div>`; return; }
  const text = await res.text();
  if (text === raw) return;
  raw = text; P = JSON.parse(text);
  // follow the piece when the agent moves it on, unless the user is looking at something else on purpose
  if (!view || view === followed) view = P.stage;
  followed = P.stage;
  render();
}
// a re-render keeps the field you're in: same element (by its data attributes), same unsaved text, same caret
function captureFocus() {
  const a = document.activeElement;
  if (!a || a === document.body || !(a.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return null;
  const sel = a.id ? `#${a.id}` : Object.entries(a.dataset).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}="${CSS.escape(v)}"]`).join('');
  if (!sel) return null;
  const range = a.isContentEditable ? (() => { const r = getSelection(); return r.rangeCount ? [r.anchorOffset, r.focusOffset] : null; })() : [a.selectionStart, a.selectionEnd];
  return { sel, value: a.isContentEditable ? a.innerText : a.value, editable: a.isContentEditable, range };
}
function restoreFocus(f) {
  const el = f && document.querySelector(f.sel); if (!el) return;
  if (f.editable) el.innerText = f.value; else el.value = f.value;
  el.focus({ preventScroll: true });
  try {
    if (f.editable && el.firstChild && f.range) { const r = document.createRange(), n = el.firstChild, len = n.textContent.length; r.setStart(n, Math.min(f.range[0], len)); r.setEnd(n, Math.min(f.range[1], len)); const g = getSelection(); g.removeAllRanges(); g.addRange(r); }
    else if (f.range && el.setSelectionRange) el.setSelectionRange(f.range[0], f.range[1]);
  } catch {}
}
async function act(body) {
  const res = await fetch(`/api/piece?p=${encodeURIComponent(piece)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const r = await res.json();
  toast(r.error ? `✗ ${r.error}` : 'sent to your agent');
  raw = ''; await load();
}
let tt; function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1800); }
setInterval(() => load().catch(() => {}), 1500);

function renderList(list) {
  document.getElementById('app').innerHTML = `<div style="max-width:720px;margin:0 auto;padding:60px 24px"><h1 class="serif" style="font-size:44px;margin:0 0 6px">Your pieces</h1><p class="dim" style="margin:0 0 28px">Each one is a video in progress. Your agent starts one with <span class="mono">pamo piece init</span>.</p>
    ${list.length ? list.map((x) => `<a href="?p=${encodeURIComponent(x.piece)}" style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none"><span><span style="font-size:17px">${esc(x.title)}</span> <span class="faint mono" style="font-size:12px">pieces/${esc(x.piece)}</span></span><span class="dim mono" style="font-size:12px">${esc(x.stage)} · ${badge(x.status)}</span></a>`).join('') : '<p class="faint">No pieces yet.</p>'}</div>`;
}

// ─── stages ────────────────────────────────────────────────────────────────────────
function briefHTML() {
  return `<div style="display:grid;gap:14px"><p class="faint" style="margin:0;font-size:13px">Click any text to edit it. Your agent works from your version.</p>${Object.entries(BRIEF_HELP).map(([k, [l, help]]) => `<div class="brow">
    <span class="dim mono blabel">${l}<span class="info" tabindex="0" role="button" aria-label="What goes in ${l}">${I.info}<span class="tip" role="tooltip">${help}</span></span></span>
    <div class="edit" contenteditable="plaintext-only" spellcheck="false" data-brief="${k}" data-placeholder="empty" style="${k === 'what' ? 'font:22px/1.35 var(--serif)' : ''}">${esc(P.brief[k])}</div></div>`).join('')}</div>`;
}
// the boards your agent shared for this stage: open one to compare and choose; the choice reaches your agent
function boardsHTML(stage) {
  const list = (P.boards ?? []).filter((b) => b.stage === stage);
  if (!list.length) return '';
  const waiting = list.filter((b) => b.status === 'waiting').length;
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:8px"><div class="dim mono" style="font-size:12px">${waiting ? `${waiting} board${waiting > 1 ? 's' : ''} waiting for your choice` : 'boards'}</div>
    ${list.map((b) => `<a href="${esc(b.url)}" target="_blank" rel="noopener" style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border:1px solid ${b.status === 'waiting' ? 'var(--paper)' : 'var(--line)'};border-radius:10px;background:var(--panel);text-decoration:none">
      <span style="min-width:0"><span style="display:block">${esc(b.title)}</span>${b.line ? `<span class="mono faint" style="font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.line.replace(/^paper-motion:\s*/, ''))}</span>` : ''}</span>
      ${b.status === 'waiting' ? `<span class="btn small primary" style="flex-shrink:0">open and choose ↗</span>` : badge('approved').replace('approved', 'chosen')}</a>`).join('')}</div>`;
}
function lookHTML() {
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:26px">${boardsHTML('look')}${lookBody()}</div>`;
}
function lookBody() {
  const L = P.look, row = (label, inner) => `<div><div class="dim mono" style="font-size:12px;margin-bottom:8px">${label}</div>${inner}</div>`;
  if (!L.colors.length && !L.fonts.length && !L.backgrounds.length && !L.moves.length) return `<p class="dim">Nothing chosen yet. Your agent proposes palettes, type, backgrounds and moves on boards; what you pick lands here.</p>`;
  return `<div style="display:grid;gap:22px">
    ${L.colors.length ? row('palette', `<div style="display:flex;gap:10px;flex-wrap:wrap">${L.colors.map(([n, h]) => `<div style="display:grid;gap:4px;justify-items:center"><div class="sw" style="background:${esc(h)}"></div><span class="faint mono" style="font-size:10px">${esc(n)}</span></div>`).join('')}</div>`) : ''}
    ${L.fonts.length ? row('type', L.fonts.map(([r, f]) => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${esc(f)}</span><span class="faint mono" style="font-size:12px">${esc(r)}</span></div>`).join('')) : ''}
    <div style="display:flex;gap:24px;flex-wrap:wrap">${L.backgrounds.length ? row('backgrounds', `<div style="display:flex;gap:6px;flex-wrap:wrap">${L.backgrounds.map((b) => `<span class="chip">${esc(b)}</span>`).join('')}</div>`) : ''}
    ${L.moves.length ? row('moves', `<div style="display:flex;gap:6px;flex-wrap:wrap">${L.moves.map((m) => `<span class="chip">${esc(m)}</span>`).join('')}</div>`) : ''}</div></div>`;
}
function structureHTML() {
  const boards = boardsHTML('structure');
  if (!P.parts.length) return boards + (boards ? '' : `<p class="dim">No structure yet. Your agent proposes a few on a board; the one you choose shows here, beat by beat.</p>`);
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:26px">${boards}${structureBody()}</div>`;
}
function structureBody() {
  if (!P.parts.length) return `<p class="dim">No structure yet. Your agent proposes a few on a board; the one you choose shows here, beat by beat.</p>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">${P.parts.map((p, i) => `<div>
    <div style="border-radius:8px;overflow:hidden;aspect-ratio:16/9">${p.clip ? vid(p.clip) : '<div class="empty">no block yet</div>'}</div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;gap:8px"><span><span class="faint mono" style="font-size:12px">0${i + 1}</span> ${esc(p.name)}</span><span class="faint mono" style="font-size:12px">${fmt(p.seconds)}</span></div>
    <div class="dim" style="font-size:12px">${esc(p.what)}</div></div>`).join('')}</div>`;
}
function partsHTML() {
  if (!P.parts.length) return `<p class="dim">The parts appear here once the structure is set.</p>`;
  return `<div style="display:grid;gap:14px">${P.parts.map((p, i) => {
    const media = p.status === 'rendering' || p.status === 'queued'
      ? `<div class="empty ${p.status === 'rendering' ? 'rendering' : ''}">${p.status}</div>`
      : p.draft ? vid(p.draft) : '<div class="empty">no draft yet</div>';
    return `<div class="card" data-drop="${i}" data-dir="${esc(p.dir)}" >
      <span class="grip" data-grip title="drag to move">${I.grip}</span>
      <div style="border-radius:8px;overflow:hidden;aspect-ratio:16/9;background:#000">${media}</div>
      <div style="display:grid;gap:10px;align-content:start;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="faint mono" style="font-size:12px">0${i + 1}</span>&nbsp; ${esc(p.name)} <span class="faint mono" style="font-size:12px">· ${esc(p.id)}</span></span>${badge(p.status)}</div>
        <div class="dim edit" contenteditable="plaintext-only" spellcheck="false" data-what="${esc(p.dir)}" data-placeholder="what this part shows" style="font-size:13px">${esc(p.what)}</div>
        ${p.note ? `<div style="color:var(--warn);font-size:13px">you asked: “${esc(p.note)}”</div>` : ''}
        ${p.error ? `<div class="mono" style="color:var(--warn);font-size:12px">render failed: ${esc(p.error)}</div>` : ''}
        ${Object.keys(p.texts).length ? `<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center">${Object.entries(p.texts).map(([k, v]) => `<span class="mono faint" style="font-size:12px">${esc(k)}</span><input class="txt" value="${esc(v)}" data-text="${esc(p.dir)}" data-key="${esc(k)}">`).join('')}</div>` : ''}
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <label class="mono dim" style="font-size:12px">length <input type="number" step="0.1" min="0.5" max="30" value="${p.seconds ?? ''}" data-sec="${esc(p.dir)}" style="width:68px"> s</label>
          <label class="mono dim" style="font-size:12px">comes in with <select data-join="${esc(p.dir)}" ${i === 0 ? 'disabled' : ''}>${P.joins.map((j) => `<option ${j === p.join ? 'selected' : ''}>${j}</option>`).join('')}</select></label>
        </div>
        ${p.status === 'review' ? `<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap"><button class="btn small primary" data-okp="${esc(p.dir)}">${I.ok} approve part</button><input placeholder="or ask for a change, then Enter" data-cp="${esc(p.dir)}" style="flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:13px"></div>` : ''}
      </div></div>`;
  }).join('')}</div>`;
}
function trackHTML() {
  if (!P.parts.length) return '';
  const T = P.parts.reduce((a, p) => a + Number(p.seconds ?? 0), 0);
  return `<div class="track">${P.parts.map((p, i) => `
    ${i ? `<span title="${p.join}" style="display:grid;place-items:center;width:28px;color:var(--dim)">${I.join[p.join] ?? I.join.dissolve}</span>` : ''}
    <div data-drop="${i}" data-dir="${esc(p.dir)}" draggable="true" data-trackdrag class="tblock" style="flex:${p.seconds ?? 1} 1 0;border-radius:8px;overflow:hidden;position:relative;outline:1px solid var(--line2);height:60px;background:#000">
      ${p.draft ? `<video src="${esc(p.draft)}#t=${Math.min(1, (p.seconds ?? 2) / 2)}" preload="metadata" muted style="height:100%;object-fit:cover;pointer-events:none"></video>` : ''}
      <span style="position:absolute;inset:auto 0 0 0;padding:4px 8px;background:linear-gradient(#0000,#000c);display:flex;justify-content:space-between;font-size:12px;pointer-events:none"><span>${esc(p.name)}</span><span class="mono dim">${fmt(p.seconds)}</span></span>
    </div>`).join('')}</div><div class="faint mono" style="font-size:12px;margin-top:6px;text-align:right">${fmt(T)} in total · drag to reorder</div>`;
}
function assemblyHTML(st) {
  return `${P.media.assembly ? `<div style="border-radius:12px;overflow:hidden">${vid(P.media.assembly, 'controls')}</div>` : `<div class="empty ${st === 'working' ? 'rendering' : ''}" style="border-radius:12px">${st === 'working' ? 'your agent is joining the parts' : 'not joined yet'}</div>`}${trackHTML()}`;
}
function finalHTML(st) {
  const out = P.media.outputs;
  return `${P.media.final ? `<div style="border-radius:12px;overflow:hidden">${vid(P.media.final, 'controls')}</div>` : `<div class="empty ${st === 'working' ? 'rendering' : ''}" style="border-radius:12px">${st === 'working' ? 'rendering at full quality' : 'not rendered yet'}</div>`}
    ${out.length ? `<div style="display:grid;gap:0">${out.map((o) => `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0"><span class="mono">${esc(o.file)}</span><span style="display:flex;gap:14px;align-items:center"><span class="faint mono" style="font-size:12px">${(o.bytes / 1e6).toFixed(1)} MB</span><a class="btn small" href="${esc(o.url)}" download="${esc(o.file)}">${I.down} download</a></span></div>`).join('')}</div>
    <p class="faint" style="font-size:13px;margin:0">Need another shape (9:16, 1:1), a ProRes master or a GIF? Ask for it in the changes box.</p>` : ''}`;
}

function render() {
  if (!P) return;
  const focus = captureFocus();
  const k = view, st = P.stages[k].status, [, title, sub] = STAGES[order(k)];
  const approvedParts = P.parts.filter((p) => p.status === 'approved').length;
  const rail = STAGES.map(([key, t, s], n) => {
    const ss = P.stages[key].status, on = key === k, can = ss !== 'pending' || key === P.stage;
    return `<button data-go="${key}" ${can ? '' : 'disabled'} class="step${on ? ' on' : ''}">
      <span class="mono faint" style="font-size:12px;padding-top:2px">0${n + 1}</span>
      <span><span style="display:block">${t}</span><span class="dim sub" style="font-size:12px">${key === 'parts' && P.parts.length ? `${approvedParts} of ${P.parts.length} approved` : s}</span></span>
      <span style="color:${(STATUS[ss] ?? [])[1]};padding-top:2px">${I[ss] ?? ''}</span></button>`;
  }).join('');
  const body = { brief: briefHTML, look: lookHTML, structure: structureHTML, parts: partsHTML, assembly: () => assemblyHTML(st), final: () => finalHTML(st) }[k]();
  const canApprove = st === 'review' && (k !== 'parts' || (P.parts.length && approvedParts === P.parts.length));
  const notes = P.events.filter((e) => e.stage === k && e.kind === 'changes').slice(-8);
  const activity = P.events.filter((e) => e.stage === k).slice(-6).reverse();
  const total = P.parts.reduce((a, p) => a + Number(p.seconds ?? 0), 0);
  const app = document.getElementById('app');
  app.innerHTML = `<div id="grid" class="shell" style="--rw:${rightW}px">
    <aside class="rail">
      <div class="head"><a href="/" class="faint mono" style="font-size:12px;text-decoration:none">← pieces</a><div class="serif" style="font-size:24px;line-height:1.1;margin-top:10px">${esc(P.title)}</div><div class="dim mono" style="font-size:12px;margin-top:6px">${[P.brand, P.dir, P.format, total ? fmt(total) : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
      <div class="steps">${rail}</div>
    </aside>
    <main class="stage">
      <header><div class="dim mono" style="font-size:12px">stage ${order(k) + 1} of 6</div><h1 class="serif">${title}</h1><div class="dim">${sub}</div></header>
      ${body}
    </main>
    <aside class="decide">
      <div id="resize" title="drag to resize · double-click to reset" style="position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:5"><span style="position:absolute;left:4px;top:50%;width:2px;height:44px;margin-top:-22px;border-radius:2px;background:var(--line2)"></span></div>
      <div>${badge(st)}${P.stages[k].at ? `<span class="faint mono" style="font-size:12px"> · ${clock(P.stages[k].at)}</span>` : ''}</div>
      ${P.stages[k].note && st !== 'approved' ? `<div style="font-size:13px;border-left:2px solid var(--warn);padding-left:10px">${esc(P.stages[k].note)}</div>` : ''}
      ${k === 'parts' && st === 'review' && !canApprove ? `<p class="dim" style="margin:0;font-size:13px">Approve each part, or ask for changes. Once they all are, your agent joins them.</p>` : ''}
      ${st === 'review' ? `<button class="btn primary" data-oks="${k}" ${canApprove ? '' : 'disabled'} style="justify-content:center">${I.ok} approve ${title.toLowerCase()}</button>
        <div><textarea id="note" placeholder="Anything to change? Your agent reads it and brings this stage back to you."></textarea><button class="btn small" data-cs="${k}" style="margin-top:8px">${I.note} ask for changes</button></div>` : ''}
      ${st === 'approved' ? `<p class="dim" style="margin:0;font-size:13px">Approved. Reopen it to ask for a change.</p><button class="btn small" data-reopen="${k}" style="justify-self:start">${I.changes} reopen</button>` : ''}
      ${st === 'working' || st === 'changes' ? `<p class="dim" style="margin:0;font-size:13px">Your agent is working on this stage. It shows up here when it's ready.</p>` : ''}
      ${st === 'pending' ? `<p class="dim" style="margin:0;font-size:13px">This comes after ${esc(STAGES[order(k) - 1]?.[1] ?? '')}.</p>` : ''}
      ${notes.length ? `<div class="notes" style="display:grid;gap:8px"><div class="faint mono" style="font-size:12px">your notes</div>${notes.map((f) => `<div style="font-size:13px;border-left:2px solid var(--line2);padding-left:10px">${f.part ? `<span class="faint mono">${esc(f.part)}</span> · ` : ''}${esc(f.text)} <span class="faint mono" style="font-size:11px">${clock(f.at)}</span></div>`).join('')}</div>` : ''}
      ${activity.length ? `<div class="activity" style="display:grid;gap:6px"><div class="faint mono" style="font-size:12px">sent to your agent</div>${activity.map((e) => `<div class="mono faint" style="font-size:11px;line-height:1.4">${clock(e.at)} · ${esc(e.part ? `${e.part} ` : '')}${esc(e.kind === 'edit' ? `${e.key} → ${e.text}` : e.kind === 'changes' ? 'changes asked' : e.kind)}</div>`).join('')}</div>` : ''}
    </aside></div>`;
  app.querySelectorAll('video[data-k]').forEach((v) => { const c = vcache.get(v.dataset.k); if (c) v.replaceWith(c); else vcache.set(v.dataset.k, v); });
  restoreFocus(focus);
  // on a phone the stages are a strip: keep the open one in view
  const on = app.querySelector('.step.on'); if (on && on.parentElement.scrollWidth > on.parentElement.clientWidth) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}
const vcache = new Map();   // videos keep playing across re-renders (the key includes the file's mtime)

// ─── wiring ────────────────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.go) { view = d.go; render(); }
  else if (d.okp) act({ type: 'approve-part', part: d.okp });
  else if (d.oks) act({ type: 'approve', stage: d.oks });
  else if (d.cs) { const v = document.getElementById('note').value; if (v.trim()) act({ type: 'changes', stage: d.cs, text: v }); else toast('write what to change first'); }
  else if (d.reopen) act({ type: 'reopen', stage: d.reopen });
});
document.addEventListener('change', (e) => {
  const d = e.target.dataset;
  if (d.text) act({ type: 'text', part: d.text, key: d.key, value: e.target.value });
  if (d.sec) act({ type: 'seconds', part: d.sec, value: e.target.value });
  if (d.join) act({ type: 'join', part: d.join, value: e.target.value });
});
document.addEventListener('focusout', (e) => {
  const d = e.target.dataset, v = e.target.isContentEditable ? e.target.innerText.trim() : null;
  if (d.brief && v !== P.brief[d.brief]) act({ type: 'brief', key: d.brief, value: v });
  else if (d.what && v !== P.parts.find((p) => p.dir === d.what)?.what) act({ type: 'what', part: d.what, value: v });
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.isContentEditable && !e.shiftKey) { e.preventDefault(); e.target.blur(); return; }   // Enter saves; Shift+Enter breaks a line
  const d = e.target.dataset;
  if (d.cp && e.target.value.trim()) act({ type: 'changes', stage: 'parts', part: d.cp, text: e.target.value });
});
// the decision column: drag its left edge, between RW[0] and RW[1]; double-click resets
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('#resize')) return;
  e.preventDefault(); document.body.classList.add('resizing');
  const grid = document.getElementById('grid');
  const move = (ev) => { rightW = Math.round(Math.min(RW[1], Math.max(RW[0], innerWidth - ev.clientX))); grid.style.setProperty('--rw', `${rightW}px`); };
  const up = () => { document.body.classList.remove('resizing'); removeEventListener('pointermove', move); removeEventListener('pointerup', up); try { localStorage.setItem('studio:rw', rightW); } catch {} };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
document.addEventListener('dblclick', (e) => { if (e.target.closest('#resize')) { rightW = 340; try { localStorage.removeItem('studio:rw'); } catch {} render(); } });
// drag to reorder: a card only while held by its grip (its fields stay usable); track blocks always
let dragFrom = null;
document.addEventListener('pointerdown', (e) => { if (e.target.closest('[data-grip]')) e.target.closest('.card').draggable = true; });
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest?.('.card[draggable=true],[data-trackdrag]'); if (!el) return;
  dragFrom = Number(el.dataset.drop); el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragFrom));
});
const clearMarks = () => document.querySelectorAll('.drop-before,.drop-after').forEach((x) => x.classList.remove('drop-before', 'drop-after'));
document.addEventListener('dragover', (e) => {
  if (dragFrom === null) return;
  const el = e.target.closest('[data-drop]'); if (!el) return;
  e.preventDefault(); clearMarks();
  const r = el.getBoundingClientRect(), horiz = el.hasAttribute('data-trackdrag');
  el.classList.add((horiz ? e.clientX < r.left + r.width / 2 : e.clientY < r.top + r.height / 2) ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', (e) => {
  const el = e.target.closest('[data-drop]'); if (dragFrom === null || !el) return;
  e.preventDefault();
  let to = Number(el.dataset.drop) + (el.classList.contains('drop-after') ? 1 : 0);
  if (to > dragFrom) to--;
  const dirs = P.parts.map((p) => p.dir);
  if (to !== dragFrom) { const [m] = dirs.splice(dragFrom, 1); dirs.splice(to, 0, m); act({ type: 'order', order: dirs }); }
  dragFrom = null; clearMarks();
});
document.addEventListener('dragend', () => { dragFrom = null; clearMarks(); document.querySelectorAll('.dragging').forEach((x) => x.classList.remove('dragging')); document.querySelectorAll('.card[draggable=true]').forEach((x) => (x.draggable = false)); });
load();
</script>
</body>
</html>
