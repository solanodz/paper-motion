<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>manifesto</title>
<!--
  Recipe · manifesto (18 s). Words only: three statements, a turn, the name.
  One idea: the statements stand in space at different depths and the camera walks toward them, through them. Each
  sentence is large and close when it speaks, then slides past the lens, soft, as the next one sharpens ahead. The
  path bends (a little yaw each step) so the words are seen from a slightly different angle every time; the turn is
  the camera settling straight on the name.
  Statement 1 0–4 s · Statement 2 4–8 s · Statement 3 8–12 s · Turn 12–15 s · Close 15–18 s.
  Look, fonts, pace and sound come from /brand (serve from the project root). Edit CONFIG first: three statements
  under eight words, in the brand's voice.
-->
<style>
  #stage { overflow: hidden; }
  .abs { position: absolute; box-sizing: border-box; }
  .place { display: flex; flex-direction: column; align-items: flex-start; text-align: left; box-sizing: border-box; }
  .place.center { align-items: center; text-align: center; }
</style>
</head>
<body>
<main id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="vig" class="abs" style="inset:0"></div>
  <div id="world">
    <div id="p1" class="place"><div id="s1"></div></div>
    <div id="p2" class="place"><div id="s2"></div></div>
    <div id="p3" class="place"><div id="s3"></div></div>
    <div id="p4" class="place center"><div id="turn"></div><div id="what"></div><div id="action"></div></div>
  </div>
  <div id="index" class="abs"></div>
</main>
<script type="module">
import { scene, progress, ease } from 'paper-motion';
import { wordRise, trackIn, popIn, scramble, blurIn } from 'paper-motion/moves';
import { camera } from 'paper-motion/kit';
import { loadBrand } from 'paper-motion/brand';

const CONFIG = {
  background: null,                      // a shader-set id, or null for the brand's first entry
  backgroundOpacity: 0.4,                // words carry this piece; the field stays behind them
  statements: [
    'Tools were made for hands.',
    'Agents have none.',
    'So we made the tool speak.',
  ],
  what: '',                              // what the brand is, in plain words; empty reads IDENTITY.md's "In one line"
  action: 'your.site',
  format: [1920, 1080],
};

const B = await loadBrand();
const [W, H] = CONFIG.format, SHORT = Math.min(W, H), D = 18;
const s = scene({ width: W, height: H, fps: 30, duration: D, background: B.color('ground') });
const bgId = CONFIG.background ?? B.set.entries.find((e) => e.shader && !e.image)?.id;
if (bgId) B.shader(s, '#bg', bgId);
const bg = document.querySelector('#bg'); bg.style.opacity = CONFIG.backgroundOpacity;
document.querySelector('#vig').style.background = 'radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%)';
const $ = (id) => document.getElementById(id);

// the walk: a step of STEP per statement; the camera reads each from DIST in front
const STEP = SHORT * 1.2, DIST = SHORT * 0.6, K = 1 + DIST / (SHORT * 1.6);
const cam = camera($('stage'), $('world'), { perspective: SHORT * 1.6 });
const st = [B.style($('s1'), 'display', { short: SHORT * K }), B.style($('s2'), 'display', { short: SHORT * K }), B.style($('s3'), 'display', { short: SHORT * K })];
st.forEach((el, i) => { el.textContent = CONFIG.statements[i] ?? ''; el.style.maxWidth = '13ch'; });
const turn = B.style($('turn'), 'display', { short: SHORT * K });
const what = B.style($('what'), 'title', { short: SHORT * K, color: 'muted' }), action = B.style($('action'), 'body', { short: SHORT * K, color: 'figure' });
Object.assign(action.style, { fontFamily: B.font('mono'), fontSize: `${SHORT * K * 0.028}px`, letterSpacing: '0em', marginTop: `${SHORT * 0.03}px` });
what.style.marginTop = `${SHORT * 0.03}px`;
what.textContent = CONFIG.what || ((B.identity['In one line'] ?? '').split('\n')[0] || '');
action.textContent = CONFIG.action; turn.textContent = B.name;
for (const id of ['p1', 'p2', 'p3', 'p4']) $(id).style.width = `${W * 0.86}px`;
// the statements step left, right, left of the path and face it; the name waits straight ahead
const Z = (i) => -i * STEP;
cam.place($('p1'), { z: Z(0), x: -SHORT * 0.06, yaw: 6 });
cam.place($('p2'), { z: Z(1), x: SHORT * 0.14, y: SHORT * 0.06, yaw: -9 });
cam.place($('p3'), { z: Z(2), x: -SHORT * 0.1, y: -SHORT * 0.05, yaw: 7, pitch: 2 });
cam.place($('p4'), { z: Z(3) });
const index = B.style($('index'), 'caption', { short: SHORT, color: 'muted' });
Object.assign(index.style, { left: `${W * 0.07}px`, top: `${H * 0.08}px`, fontFamily: B.font('mono') });
await document.fonts.ready;

const T = { s2: 4, s3: 8, turn: 12, close: 15 };
const at = (i, extra = {}) => ({ z: Z(i) + DIST, ...extra });
const path = [
  [0, at(0, { x: -SHORT * 0.04, y: 0, yaw: 4, pitch: -1 })],
  [T.s2 - 0.7, at(0, { yaw: 5 })],
  [T.s2 + 0.8, at(1, { x: SHORT * 0.1, y: SHORT * 0.04, yaw: -7, pitch: 1 }), ease.inOutCubic],
  [T.s3 - 0.7, at(1, { yaw: -8 })],
  [T.s3 + 0.8, at(2, { x: -SHORT * 0.07, y: -SHORT * 0.03, yaw: 6, pitch: 2 }), ease.inOutCubic],
  [T.turn - 0.6, at(2, { yaw: 7 })],
  [T.turn + 1.1, at(3, { x: 0, y: 0, yaw: 0, pitch: 0 }), ease.inOutQuart],   // the turn: the camera comes straight
  [D, at(3, { z: Z(3) + DIST * 0.9 }), ease.inOutSine],
];
const out = (el, t, at, dur = 0.5) => { const p = progress(t, at - dur, at, ease.inCubic); if (p > 0) el.style.opacity = String(Math.min(Number(el.style.opacity || 1), 1 - p)); };
s.update((t) => {
  cam.travel(t, path);
  cam.focus(DIST, SHORT * 0.8, 10);
  bg.style.transform = `scale(${1.06 + 0.1 * progress(t, 0, D)}) translateX(${SHORT * 0.03 * progress(t, 0, D)}px)`;
  // three statements, three entrances (rise, track in, pop), each as the camera arrives
  wordRise(st[0], t, { start: 0.3, each: B.pace.stagger * 1.4, duration: 0.9 });
  trackIn(st[1], t, { start: T.s2 - 0.15, duration: 1.1 });
  popIn(st[2], t, { start: T.s3 - 0.15, each: 0.06 });
  // the turn: the name scrambles in once the camera has settled, then what it is and the action
  scramble(turn, t, { start: T.turn + 0.05, duration: 1.3, seed: 3 });
  blurIn(what, t, { start: T.close, duration: 0.8 });
  blurIn(action, t, { start: T.close + 0.7, duration: 0.8 });
  const n = t < T.s2 ? 1 : t < T.s3 ? 2 : t < T.turn ? 3 : 0;
  index.textContent = n ? `${n} / 3` : '';
});
B.cue(s, 'land', 0.3); B.cue(s, 'transition', T.s2); B.cue(s, 'text', T.s2 + 0.5); B.cue(s, 'transition', T.s3); B.cue(s, 'text', T.s3 + 0.5);
B.cue(s, 'transition', T.turn); B.cue(s, 'land', T.turn + 1.6); B.cue(s, 'text', T.close);
B.sound(s);
await s.start();
</script>
</body>
</html>
