<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>manifesto</title>
<!--
  Recipe · manifesto (18 s). Words only: three statements, a turn, the name.
  Statement 1 0–4 s (words rise, large) · Statement 2 4–8 s (tracks in while the first blurs out) · Statement 3 8–12 s
  (pops in, word by word) · Turn 12–15 s (the brand's name scrambles in) · Close 15–18 s (what it is, the action).
  Look, fonts, pace and sound come from /brand (serve from the project root). Edit CONFIG first: the three statements are
  the piece; keep each under eight words, and write them in the brand's voice, not in slogans.
-->
<style>
  #stage { overflow: hidden; }
  .abs { position: absolute; box-sizing: border-box; }
  .frame { position: absolute; inset: 0; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8%; box-sizing: border-box; }
  .left { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9%; box-sizing: border-box; }
</style>
</head>
<body>
<main id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="vig" class="abs" style="inset:0"></div>
  <div id="f1" class="frame"><div class="left"><div id="s1"></div></div></div>
  <div id="f2" class="frame"><div class="left"><div id="s2"></div></div></div>
  <div id="f3" class="frame"><div class="left"><div id="s3"></div></div></div>
  <div id="f4" class="frame"><div class="center"><div id="turn"></div><div id="what"></div><div id="action"></div></div></div>
  <div id="index" class="abs"></div>
</main>
<script type="module">
import { scene, progress, ease } from 'paper-motion';
import { wordRise, trackIn, popIn, scramble, blurIn } from 'paper-motion/moves';
import { loadBrand } from 'paper-motion/brand';

const CONFIG = {
  background: null,                      // a shader-set id, or null for the brand's first entry
  backgroundOpacity: 0.4,                // words carry this piece; the field stays behind them
  statements: [
    'Tools were made for hands.',
    'Agents have none.',
    'So we made the tool speak.',
  ],
  what: '',                              // what the brand is, in plain words; empty reads IDENTITY.md's "In one line"
  action: 'your.site',
  format: [1920, 1080],
};

const B = await loadBrand();
const [W, H] = CONFIG.format, SHORT = Math.min(W, H), D = 18;
const s = scene({ width: W, height: H, fps: 30, duration: D, background: B.color('ground') });
const bgId = CONFIG.background ?? B.set.entries.find((e) => e.shader && !e.image)?.id;
if (bgId) B.shader(s, '#bg', bgId);
document.querySelector('#bg').style.opacity = CONFIG.backgroundOpacity;
document.querySelector('#vig').style.background = 'radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5) 100%)';
const $ = (id) => document.getElementById(id);

const st = [B.style($('s1'), 'display', { short: SHORT }), B.style($('s2'), 'display', { short: SHORT }), B.style($('s3'), 'display', { short: SHORT })];
st.forEach((el, i) => { el.textContent = CONFIG.statements[i] ?? ''; el.style.maxWidth = '14ch'; });
const turn = B.style($('turn'), 'display', { short: SHORT });
const what = B.style($('what'), 'title', { short: SHORT, color: 'muted' }), action = B.style($('action'), 'body', { short: SHORT, color: 'figure' });
Object.assign(action.style, { fontFamily: B.font('mono'), fontSize: `${SHORT * 0.028}px`, letterSpacing: '0em', marginTop: `${SHORT * 0.03}px` });
what.style.marginTop = `${SHORT * 0.03}px`;
what.textContent = CONFIG.what || ((B.identity['In one line'] ?? '').split('\n')[0] || '');
action.textContent = CONFIG.action;
turn.textContent = B.name;
// the index: 1 / 3 in the corner, the brand's caption role
const index = B.style($('index'), 'caption', { short: SHORT, color: 'muted' });
Object.assign(index.style, { left: `${W * 0.09}px`, top: `${H * 0.08}px`, fontFamily: B.font('mono') });
await document.fonts.ready;

// timeline
const T = { s2: 4, s3: 8, turn: 12, close: 15 };
const frames = [$('f1'), $('f2'), $('f3'), $('f4')];
const RESET = ['transform', 'opacity', 'filter', 'clipPath', 'zIndex'];
const clean = (els) => els.forEach((e) => RESET.forEach((k) => { e.style[k] = ''; }));
const out = (el, t, at, dur = 0.5) => { const p = progress(t, at - dur, at, ease.inCubic); if (p > 0) { el.style.opacity = String(Math.min(Number(el.style.opacity || 1), 1 - p)); el.style.filter = `blur(${p * 10}px)`; } };
s.update((t) => {
  clean(frames);
  frames.forEach((f, i) => { f.style.opacity = 0; f.style.zIndex = i + 1; });
  if (t < T.s2) frames[0].style.opacity = 1;
  else if (t < T.s3) frames[1].style.opacity = 1;
  else if (t < T.turn) frames[2].style.opacity = 1;
  else frames[3].style.opacity = 1;
  // 1 · rises  2 · tracks in  3 · pops word by word: three ways for three thoughts
  wordRise(st[0], t, { start: 0.3, each: B.pace.stagger * 1.4, duration: 0.9 }); out(st[0], t, T.s2);
  trackIn(st[1], t, { start: T.s2 + 0.1, duration: 1.1 }); out(st[1], t, T.s3);
  popIn(st[2], t, { start: T.s3 + 0.1, each: 0.06 }); out(st[2], t, T.turn);
  // 4 · the turn: the name scrambles in, then what it is and the action
  scramble(turn, t, { start: T.turn, duration: 1.3, seed: 3 });
  blurIn(what, t, { start: T.close, duration: 0.8 });
  blurIn(action, t, { start: T.close + 0.7, duration: 0.8 });
  const n = t < T.s2 ? 1 : t < T.s3 ? 2 : t < T.turn ? 3 : 0;
  index.textContent = n ? `${n} / 3` : '';
});
B.cue(s, 'land', 0.3); B.cue(s, 'text', T.s2); B.cue(s, 'text', T.s3); B.cue(s, 'transition', T.turn); B.cue(s, 'land', T.turn + 1.2); B.cue(s, 'text', T.close);
B.sound(s);
await s.start();
</script>
</body>
</html>
